'use strict';

/* ============================================================================
   SAME ROOM — Step 3
   ----------------------------------------------------------------------------
   One-room puzzle-platformer. Plain HTML + JS + Canvas 2D. No libraries.

   Section order:
     CONFIG ......... CONFIG object, act THEMES, STRINGS (all user-visible text)
     INPUT .......... keyboard state
     LEVEL DATA ..... ASCII levels + parsing
     PLAYER/PHYSICS . movement, collisions, hazards, particles, path recording
     RULES .......... RULES registry (per-level gameplay modifiers)
     BACKGROUNDS .... static act backdrops + dynamic living wall
     RENDERING ...... all drawing (incl. debug view)
     GAME STATE ..... Game object, level loading, narrator, main update
     MAIN LOOP ...... fixed-timestep loop

   Level kit so far:
     Act 1: L1 (no rules) · L2 pathLava · L3 buttonGate · L4 shyDoor
            L5 deathSpike · L6 jumpShift
     Act 2: L7 mirrorControls · L8 gravityFlip · L9 swapKeysOnJump
            L10 inputDelay · L11 noRepeatDirection · L12 speedByDoorDistance
     Act 3: L13-L14 ghostEcho + heldGate · L15 ghostEcho (lethal chaser)
            L16 reverse ghostEcho · L17 deathPlatforms · L18 scriptedGhost
   ========================================================================== */

function localizeDigits(value) {
  const persian = '۰۱۲۳۴۵۶۷۸۹';
  return String(value).replace(/[0-9]/g, d => persian.charAt(d.charCodeAt(0) - 48));
}

function playerNumber(value) {
  return CONFIG.LANG === 'fa' ? localizeDigits(value) : String(value);

/* ============================== AUDIO =====================================
   All sound is synthesized at runtime. AudioContext and its buffers are made
   only after the first pointer/key gesture; any failure degrades to silence.
   ========================================================================== */

let audioRandomState = ((Date.now() ^ Math.floor(performance.now() * 1000) ^ 0x9e3779b9) >>> 0) || 0x6d2b79f5;
function audioRandomUnit() {
  audioRandomState = (Math.imul(audioRandomState, 1664525) + 1013904223) >>> 0;
  return audioRandomState / 4294967296;
}

function audioClamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function audioPanForX(x) {
  return audioClamp(((Number(x) - VIEW_W / 2) / (VIEW_W / 2)) * 0.4, -0.4, 0.4);
}

function audioParamValue(param, value, time) {
  try {
    if (param && param.setValueAtTime) param.setValueAtTime(value, time);
    else if (param) param.value = value;
  } catch (e) {}
}

function audioParamRamp(param, method, value, time) {
  try {
    if (param && typeof param[method] === 'function') param[method](value, time);
    else if (param) param.value = value;
  } catch (e) {}
}

function audioTrackNode(voice, node, isSource) {
  if (!voice || !node) return node;
  voice.nodes.push(node);
  if (isSource) {
    voice.sourceCount++;
    node.onended = () => {
      if (voice.cleaned) return;
      voice.endedCount++;
      try { node.disconnect(); } catch (e) {}
      if (voice.endedCount >= voice.sourceCount) voice.cleanup();
    };
  }
  return node;
}

function audioSetEnvelope(param, t, duration, peak, attack, release) {
  const floor = 0.0001;
  const a = Math.max(0.001, Math.min(attack || 0.003, duration * 0.45));
  const r = Math.max(0.004, Math.min(release || duration * 0.55, duration - a));
  audioParamValue(param, floor, t);
  audioParamRamp(param, 'linearRampToValueAtTime', Math.max(floor, peak), t + a);
  const releaseAt = Math.max(t + a, t + duration - r);
  audioParamValue(param, Math.max(floor, peak), releaseAt);
  audioParamRamp(param, 'exponentialRampToValueAtTime', floor, t + duration);
}

function audioAddTone(ctx, t, out, opts, spec) {
  const voice = opts._voice;
  const duration = Math.max(0.006, spec.duration || 0.05);
  const rate = Number.isFinite(opts.rate) ? opts.rate : 1;
  const osc = audioTrackNode(voice, ctx.createOscillator(), true);
  osc.type = spec.type || 'sine';
  const startHz = Math.max(1, (spec.startHz || spec.frequency || 440) * rate);
  const endHz = Math.max(1, (spec.endHz === undefined ? startHz : spec.endHz) * rate);
  audioParamValue(osc.frequency, startHz, t);
  if (Math.abs(endHz - startHz) > 0.01)
    audioParamRamp(osc.frequency, 'exponentialRampToValueAtTime', endHz, t + duration);

  let chain = osc;
  if (spec.filter) {
    const filter = audioTrackNode(voice, ctx.createBiquadFilter(), false);
    filter.type = spec.filter.type || 'lowpass';
    if (spec.filter.Q !== undefined) audioParamValue(filter.Q, spec.filter.Q, t);
    const f0 = Math.max(20, spec.filter.startHz || spec.filter.frequency || 1000);
    const f1 = Math.max(20, spec.filter.endHz === undefined ? f0 : spec.filter.endHz);
    audioParamValue(filter.frequency, f0, t);
    if (Math.abs(f1 - f0) > 0.1)
      audioParamRamp(filter.frequency, 'exponentialRampToValueAtTime', f1, t + duration);
    chain.connect(filter);
    chain = filter;
  }

  const amp = audioTrackNode(voice, ctx.createGain(), false);
  audioSetEnvelope(amp.gain, t, duration, spec.peak === undefined ? 0.1 : spec.peak,
    spec.attack === undefined ? Math.min(0.004, duration * 0.2) : spec.attack,
    spec.release === undefined ? duration * 0.55 : spec.release);
  chain.connect(amp);
  amp.connect(out);
  if (spec.tremolo) audioAddTremolo(ctx, t, amp.gain, opts, spec.tremolo, duration);
  osc.start(t);
  osc.stop(t + duration + 0.012);
  return { osc, amp };
}

function audioAddNoise(ctx, t, out, opts, spec) {
  const voice = opts._voice, buffer = opts._noiseBuffer;
  if (!buffer) return null;
  const duration = Math.max(0.006, spec.duration || 0.04);
  const src = audioTrackNode(voice, ctx.createBufferSource(), true);
  src.buffer = buffer;
  src.loop = true;
  let chain = src;
  if (spec.filter) {
    const filter = audioTrackNode(voice, ctx.createBiquadFilter(), false);
    filter.type = spec.filter.type || 'lowpass';
    if (spec.filter.Q !== undefined) audioParamValue(filter.Q, spec.filter.Q, t);
    const f0 = Math.max(20, spec.filter.startHz || spec.filter.frequency || 1000);
    const f1 = Math.max(20, spec.filter.endHz === undefined ? f0 : spec.filter.endHz);
    audioParamValue(filter.frequency, f0, t);
    if (Math.abs(f1 - f0) > 0.1)
      audioParamRamp(filter.frequency, 'exponentialRampToValueAtTime', f1, t + duration);
    chain.connect(filter);
    chain = filter;
  }
  const amp = audioTrackNode(voice, ctx.createGain(), false);
  audioSetEnvelope(amp.gain, t, duration, spec.peak === undefined ? 0.05 : spec.peak,
    spec.attack === undefined ? Math.min(0.003, duration * 0.2) : spec.attack,
    spec.release === undefined ? duration * 0.65 : spec.release);
  if (spec.crackle) {
    const steps = 14;
    for (let i = 0; i < steps; i++) {
      const at = t + duration * i / steps;
      audioParamValue(amp.gain, Math.max(0.0001, spec.peak * (0.25 + audioRandomUnit() * 0.75)), at);
    }
    audioParamRamp(amp.gain, 'exponentialRampToValueAtTime', 0.0001, t + duration);
  }
  chain.connect(amp);
  amp.connect(out);
  const maxOffset = Math.max(0, (buffer.duration || 2) - 0.01);
  const offset = audioRandomUnit() * maxOffset;
  src.start(t, offset);
  src.stop(t + duration + 0.012);
  return { src, amp };
}

function audioAddTremolo(ctx, t, parameter, opts, spec, duration) {
  const voice = opts._voice;
  const lfo = audioTrackNode(voice, ctx.createOscillator(), true);
  const depth = audioTrackNode(voice, ctx.createGain(), false);
  lfo.type = 'sine';
  audioParamValue(lfo.frequency, spec.frequency || 6, t);
  audioParamValue(depth.gain, spec.depth === undefined ? 0.2 : spec.depth, t);
  lfo.connect(depth);
  depth.connect(parameter);
  lfo.start(t);
  lfo.stop(t + duration + 0.012);
}

function audioRandom(min, max) {
  return min + audioRandomUnit() * (max - min);
}

function audioDeathSpike(ctx, t, out, opts, metallic) {
  const r = audioRandom(0.97, 1.03);
  if (metallic) {

    audioAddTone(ctx, t, out, { ...opts, rate: r },

  audioAddTone(ctx, t, out, opts,
    { type: 'sine', startHz: 260, endHz: 55, duration: 0.16, peak: 0.45, attack: 0.003, release: 0.14 });
  audioAddNoise(ctx, t, out, opts,
    { duration: 0.18, peak: 0.28, attack: 0.003, release: 0.16,
      filter: { type: 'bandpass', startHz: 1200, endHz: 300, Q: 0.8 } });
  for (let i = 0; i < 7; i++) {
    audioAddTone(ctx, t + audioRandom(0.04, 0.26), out, opts,

    const act = game && game.level && game.level.def ? game.level.def.act : 1;
    const resolved = paletteForAct(act || 1);
    if (!ambientPalette || resolved.act !== ambientPaletteAct) applyPalette(resolved, false);
    const ts = game && game.levelIndex === 11 && Number.isFinite(game.timeScale)
      ? Math.max(0.01, game.timeScale) : 1;
    const cents = 1200 * Math.log2(ts);
    if (Math.abs(cents - ambientDetune) > 0.25) {
      const t = now();
      for (const o of [ambient.root, ambient.fifth, ambient.octave, ambient.wobble])
        target(o.detune, cents, t, 0.12);
      ambientDetune = cents;
    }
  }
  function update(game, dt) {
    if (!context || unavailable) return;
    try {
      setMuffled(!game || game.mode !== 'playing');
      const t = now();
      if (duckLevel < 1 && t >= duckUntil) {
        duckLevel = 1;
        target(busAmbient.gain, CONFIG.AUDIO.ambient, t, 0.133);
      }
      if (ambient) {
        resolveAmbient(game);
        if (t >= ambientNextDrip) {
          if (t - ambientLastDrip >= 10) {
            play('ambient_drip', {
              pan: audioRandom(-0.4, 0.4), reverbSend: 0.55,
              cooldownKey: 'ambient_drip',
            });
            ambientLastDrip = t;
          }
          ambientNextDrip = t + audioRandom(14, 35);
        }
      }
      updateGhostHum(game);
      updateDoorSlide(game);
    } catch (e) {
      // Audio is nonessential: silence and release every audio node rather
      // than allowing a browser failure to affect gameplay.
      unavailable = true;
      silenceGraph();
    }
  }
  function setMuted(value) {
    muted = !!value;
    if (master && context) target(master.gain, muted ? 0 : CONFIG.AUDIO.master, now(), 0.012);
  }
  function setMuffled(value) {
    const next = !!value;
    if (muffled === next && muffleFilter) return;
    muffled = next;
    if (!context) return;
    const t = now();
    if (muffleFilter) target(muffleFilter.frequency, muffled ? 900 : 18000, t, 0.067);
    if (busSfx) target(busSfx.gain,
      CONFIG.AUDIO.sfx * (muffled ? 0.6 : 1), t, 0.067);
  }
  function unlock() {
    if (!CONFIG.AUDIO.enabled || unavailable) return false;
    if (!createGraph()) return false;
    try {
      if (context.state === 'suspended' && context.resume) {
        const result = context.resume(); if (result && result.catch) result.catch(() => {});
      }
      startAmbient();
      return true;
    } catch (e) {
      unavailable = true;
      silenceGraph();
      return false;
    }
  }
  function onVisibility(hidden) {
    if (!context || unavailable) return;
    try {
      const result = hidden
        ? (context.suspend ? context.suspend() : null)
        : (context.resume ? context.resume() : null);
      if (result && result.catch) result.catch(() => {});
    } catch (e) {}
  }
  function audition(delta) {
    if (auditionIndex < 0)
      auditionIndex = delta >= 0 ? 0 : SOUND_CATALOGUE.length - 1;
    else auditionIndex = (auditionIndex + delta + SOUND_CATALOGUE.length) % SOUND_CATALOGUE.length;
    const name = SOUND_CATALOGUE[auditionIndex];
    play(name, { testDuration: 2, reverbSend: name === 'ghost_hum' ? 0.45 : undefined });
    return name;
  }
  function debugInfo() {
    const p = ambientPalette || (CONFIG.AUDIO.acts && CONFIG.AUDIO.acts[1]) || {};
    return {
      state: !CONFIG.AUDIO.enabled ? 'disabled' : unavailable ? 'unavailable' :
        context ? context.state : 'locked',
      voices: voiceCount(), muted, muffled, act: ambientPaletteAct,
      root: p.root || 55, fifth: p.fifth || 82.4, detune: ambientDetune,
    };
  }
  function dispose() {
    for (const v of Array.from(voices)) stopVoice(v);
    stopContinuous(ghostHum); ghostHum = null;
    stopContinuous(doorSlide); doorSlide = null;
    stopAmbient();
    if (context && context.close) { try { const p = context.close(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  }
  return {
    play, update, setMuted, setMuffled, unlock, onVisibility, dispose,
    panForX: audioPanForX, audition, debugInfo,
  };
})();

function playGateEdge(game, opened) {
  const gate = game && game.level && game.level.gateTiles && game.level.gateTiles[0];
  if (!gate) return;
  AUDIO.play(opened ? 'gate_open' : 'gate_close', {
    pan: audioPanForX((gate.tx + 0.5) * TILE),
  });
}

function makeDefaultSave() {
  return { v: 1, lang: CONFIG.LANG, current: 1, highest: 1,
           total: 0, deaths: {}, done: {}, tiles: {}, sound: true };
}

function cleanIndexMap(source, kind) {
  const out = {};
  if (!source || typeof source !== 'object' || Array.isArray(source)) return out;
  for (const [key, value] of Object.entries(source)) {
    if (!/^\d+$/.test(key)) continue;
    const idx = Number(key);
    if (!Number.isInteger(idx) || idx < 0 || idx >= CONFIG.TOTAL_LEVELS) continue;
    if (kind === 'tiles') {
      if (!Array.isArray(value)) continue;
      const seen = new Set(), cells = [];
      for (const pair of value) {
        if (!Array.isArray(pair) || pair.length < 2) continue;
        const col = Number(pair[0]), row = Number(pair[1]);
        if (!Number.isInteger(col) || !Number.isInteger(row) ||
            col < 0 || row < 0 || col >= COLS || row >= ROWS) continue;
        const cellKey = col + ',' + row;
        if (!seen.has(cellKey)) { seen.add(cellKey); cells.push([col, row]); }
      }
      out[idx] = cells;
    } else if (kind === 'done') {
      if (value) out[idx] = 1;
    } else {
      const n = Number(value);
      if (Number.isFinite(n) && n > 0) out[idx] = Math.floor(n);
    }
  }
  return out;
}

function readSavedProgress() {
  const fallback = makeDefaultSave();
  try {
    const storage = window.localStorage;
    const raw = storage && storage.getItem(CONFIG.SAVE_KEY);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.v !== 1) return fallback;
    const lang = parsed.lang === 'en' || parsed.lang === 'fa' ? parsed.lang : fallback.lang;
    const current = Number.isInteger(Number(parsed.current)) ? Number(parsed.current) : 1;
    const highest = Number.isInteger(Number(parsed.highest)) ? Number(parsed.highest) : 1;
    const total = Number.isFinite(Number(parsed.total)) ? Math.max(0, Math.floor(Number(parsed.total))) : 0;
    return {
      v: 1, lang,
      current: Math.max(1, Math.min(CONFIG.TOTAL_LEVELS, current)),
      highest: Math.max(1, Math.min(CONFIG.TOTAL_LEVELS, highest)),
      total,
      deaths: cleanIndexMap(parsed.deaths, 'deaths'),
      done: cleanIndexMap(parsed.done, 'done'),
      tiles: cleanIndexMap(parsed.tiles, 'tiles'),
      sound: parsed.sound !== false,
    };
  } catch (e) {
    return fallback;
  }
}

let save = readSavedProgress(); // remains live in memory even if storage is blocked
AUDIO.setMuted(!save.sound);

function persistSave() {
  save.v = 1;
  try {
    const storage = window.localStorage;
    if (storage && typeof storage.setItem === 'function')
      storage.setItem(CONFIG.SAVE_KEY, JSON.stringify(save));
  } catch (e) {
    // Storage can be disabled in browser tabs or restricted desktop wrappers.
  }
}

const Input = {
  left: false,
  right: false,
  jumpHeld: false,
  jumpPressed: false,    // true for exactly one update (edge)
  jumpReleased: false,   // true for exactly one update (edge)
  restartPressed: false, // true for exactly one update (edge)
  debugToggle: false,    // F2 edge: toggles debug mode
  debugSkip: false,      // N edge: skips level (only in debug mode)
  debugDigit: 0,         // 1..9 edge: jump straight to that level (debug only)
  debugPrev: false,      // '[' edge: previous level (debug only)
  debugNext: false,      // ']' edge: next level (debug only, same as N)
  languageToggle: false, // L edge: toggles fa/en while debug mode is on
  tallyToggle: false,    // K edge: adds 5 fake tally marks (debug only, visual only)
};

const JUMP_CODES = ['ArrowUp', 'KeyW', 'Space'];

function onKeyDown(e) {
  if (e.repeat) return;
  if (Menu.dependencyPendingIndex !== null) {
    e.preventDefault();
    return;
  }

  // Master mute is intentionally available in every game/menu mode.
  if (e.code === 'KeyM') {
    toggleSoundSetting();
    if (Game.mode === 'farewell') returnToMainMenu();
    else if (Game.mode === 'playing' && Game.state === 'end') openMenu();
    e.preventDefault();
    return;
  }

  // Fullscreen is available in every mode. A fullscreen keypress on the end
  // screen also follows the end screen's any-key-to-menu behavior.
  if (e.code === 'F11') {
    toggleFullscreen();
    if (Game.mode === 'farewell') returnToMainMenu();
    else if (Game.mode === 'playing' && Game.state === 'end') openMenu();
    e.preventDefault();
    return;
  }

  if (Game.mode === 'farewell') {
    returnToMainMenu();
    e.preventDefault();
    return;
  }
  if (Game.mode === 'playing' && Game.state === 'end') {
    openMenu();
    e.preventDefault();
    return;
  }
  if (Game.mode !== 'playing') {
    if (handleMenuKeyDown(e)) e.preventDefault();
    return;
  }
  if (e.code === 'Escape') {
    openMenu();
    e.preventDefault();
    return;
  }

  if (Game.mode === 'playing' && Game.debug && e.code === 'KeyY') {
    Game.audioLastAudition = AUDIO.audition(e.shiftKey ? -1 : 1);
    e.preventDefault();
    return;
  }

  // Gameplay and debug controls are active only in Game.mode === 'playing'.
  switch (e.code) {
    case 'ArrowLeft':  case 'KeyA': Input.left = true; break;
    case 'ArrowRight': case 'KeyD': Input.right = true; break;
    case 'KeyR': Input.restartPressed = true; break;
    case 'F2':   Input.debugToggle = true; break;
    case 'KeyN': Input.debugSkip = true; break;
    case 'Digit1': Input.debugDigit = 1; break;
    case 'Digit2': Input.debugDigit = 2; break;
    case 'Digit3': Input.debugDigit = 3; break;
    case 'Digit4': Input.debugDigit = 4; break;
    case 'Digit5': Input.debugDigit = 5; break;
    case 'Digit6': Input.debugDigit = 6; break;
    case 'Digit7': Input.debugDigit = 7; break;
    case 'Digit8': Input.debugDigit = 8; break;
    case 'Digit9': Input.debugDigit = 9; break;
    case 'BracketLeft':  Input.debugPrev = true; break;
    case 'BracketRight': Input.debugNext = true; break;
    case 'KeyL': Input.languageToggle = true; break;
    case 'KeyK': Input.tallyToggle = true; break;
    default:
      if (JUMP_CODES.includes(e.code)) {
        if (!Input.jumpHeld) Input.jumpPressed = true;
        Input.jumpHeld = true;
      } else {
        return; // not a game key: don't preventDefault
      }
  }
  e.preventDefault();
}

function onKeyUp(e) {
  if (Game.mode !== 'playing') return;
  switch (e.code) {
    case 'ArrowLeft':  case 'KeyA': Input.left = false; break;
    case 'ArrowRight': case 'KeyD': Input.right = false; break;
    default:
      if (JUMP_CODES.includes(e.code)) {
        // only count a release when every jump key is up
        Input.jumpHeld = false;
        Input.jumpReleased = true;
      } else {
        return;
      }
  }
  e.preventDefault();
}

window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
// dropping window focus clears held keys so the player never "sticks"
window.addEventListener('blur', () => {
  clearInputState();
});
