   One-room puzzle-platformer. Plain HTML + JS + Canvas 2D. No libraries.

     CONFIG ......... CONFIG object, act THEMES, STRINGS (all user-visible text)
     INPUT .......... keyboard state
     LEVEL DATA ..... ASCII levels + parsing
     PLAYER/PHYSICS . movement, collisions, hazards, particles, path recording
     RULES .......... RULES registry (per-level gameplay modifiers)
     RENDERING ...... all drawing (incl. debug view)
     GAME STATE ..... Game object, level loading, narrator, main update
     MAIN LOOP ...... fixed-timestep loop

   Level kit so far (act 1):
     L1 (no rules) · L2 pathLava · L3 buttonGate · L4 shyDoor

/* ============================== INPUT ==================================== */

const Input = {
  left: false,
  right: false,
  jumpHeld: false,
  jumpPressed: false,    // true for exactly one update (edge)
  jumpReleased: false,   // true for exactly one update (edge)
  restartPressed: false, // true for exactly one update (edge)
  debugToggle: false,    // F2 edge: toggles debug mode
  debugSkip: false,      // N edge: skips level (only in debug mode)
  debugDigit: 0,         // 1..6 edge: jump straight to that level (debug only)
  persianToggle: false,  // P edge: Persian narrator smoke test (debug only)
};

const JUMP_CODES = ['ArrowUp', 'KeyW', 'Space'];

function onKeyDown(e) {
  if (e.repeat) return;
  switch (e.code) {
    case 'ArrowLeft':  case 'KeyA': Input.left = true; break;
    case 'ArrowRight': case 'KeyD': Input.right = true; break;
    case 'KeyR': Input.restartPressed = true; break;
    case 'F2':   Input.debugToggle = true; break;
    case 'KeyN': Input.debugSkip = true; break;
    case 'Digit1': Input.debugDigit = 1; break;
    case 'Digit2': Input.debugDigit = 2; break;
    case 'Digit3': Input.debugDigit = 3; break;
    case 'Digit4': Input.debugDigit = 4; break;
    case 'Digit5': Input.debugDigit = 5; break;
    case 'Digit6': Input.debugDigit = 6; break;
    case 'KeyP': Input.persianToggle = true; break;
    default:
      if (JUMP_CODES.includes(e.code)) {
        if (!Input.jumpHeld) Input.jumpPressed = true;
        Input.jumpHeld = true;
      } else {
        return; // not a game key: don't preventDefault
      }
  }
  e.preventDefault();
}

function onKeyUp(e) {
  switch (e.code) {
    case 'ArrowLeft':  case 'KeyA': Input.left = false; break;
    case 'ArrowRight': case 'KeyD': Input.right = false; break;
    default:
      if (JUMP_CODES.includes(e.code)) {
        // only count a release when every jump key is up
        Input.jumpHeld = false;
        Input.jumpReleased = true;
      } else {
        return;
      }
  }
  e.preventDefault();
}

window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
// dropping window focus clears held keys so the player never "sticks"
window.addEventListener('blur', () => {
  Input.left = Input.right = Input.jumpHeld = false;
});

// Parses a grid into runtime level data (spawn, door tile, special markers).
function parseLevelGrid(grid) {
  let spawn = null;
  let door = null;
  const buttons = [];    // 'B' tiles
  const gateTiles = [];  // 'G' tiles
  const sSlots = [];     // 'S' tiles (potential spike slots)
  const mTiles = [];     // 'M' initial positions
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = 0; tx < COLS; tx++) {
      const c = grid[ty][tx];
      if (c === 'P') {
        spawn = {
          x: tx * TILE + (TILE - CONFIG.PLAYER.width) / 2,
          y: (ty + 1) * TILE - CONFIG.PLAYER.height,
        };
      } else if (c === 'D') {
        door = { tx, ty };
      } else if (c === 'B') {
        buttons.push({ tx, ty });
      } else if (c === 'G') {
        gateTiles.push({ tx, ty });
      } else if (c === 'S') {
        sSlots.push({ tx, ty });
      } else if (c === 'M') {
        mTiles.push({ tx, ty });
      }
    }
  }
  if (!spawn || !door) console.warn('Level is missing a P or D tile.');
  const spawnTile = spawn
    ? { col: Math.floor(spawn.x / TILE), row: Math.floor(spawn.y / TILE) }
    : null;
  return { spawn, door, spawnTile, buttons, gateTiles, sSlots, mTiles };
}

/* ========================== PLAYER / PHYSICS ============================= */

const player = {
  x: 0, y: 0, w: CONFIG.PLAYER.width, h: CONFIG.PLAYER.height,
  vx: 0, vy: 0,
  onGround: false,
  coyote: 0,       // frames of coyote time remaining
  jumpBuffer: 0,   // frames of buffered jump remaining
  facing: 1,
};

let particles = [];  // death-burst squares (and any future effects)

function approach(v, target, amount) {
  return v < target ? Math.min(v + amount, target)
                    : Math.max(v - amount, target);
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function tileChar(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return '#'; // outside = solid
  return Game.level.tiles[ty][tx];
}

function isSolid(tx, ty) {
  const c = tileChar(tx, ty);
  if (c === '#') return true;
  if (c === 'G') return Game.gatesClosed;      // gates are solid while closed
  // 'M' markers in the grid are just spawn points; real positions are dynamic
  return Game.mSolid.has(tx + ',' + ty);
}

// Runs cb(tx, ty) for every tile overlapped by the player's AABB.
function forEachOverlappedTile(cb) {
  const x0 = Math.floor(player.x / TILE);
  const x1 = Math.floor((player.x + player.w - 0.001) / TILE);
  const y0 = Math.floor(player.y / TILE);
  const y1 = Math.floor((player.y + player.h - 0.001) / TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      cb(tx, ty);
}

// Axis-separated AABB collision. Because max speed (12) < tile size (40),
// moving one axis at a time can never tunnel through the tile grid.
function collideX() {
  const p = player;
  const dir = Math.sign(p.vx);
  if (dir === 0) return;
  if (dir > 0) {
    let nx = p.x, hit = false;
    forEachOverlappedTile((tx, ty) => {
      if (isSolid(tx, ty)) { nx = Math.min(nx, tx * TILE - p.w - 0.001); hit = true; }
    });
    if (hit) { p.x = nx; p.vx = 0; }
  } else {
    let nx = p.x, hit = false;
    forEachOverlappedTile((tx, ty) => {
      if (isSolid(tx, ty)) { nx = Math.max(nx, (tx + 1) * TILE + 0.001); hit = true; }
    });
    if (hit) { p.x = nx; p.vx = 0; }
  }
}

function collideY() {
  const p = player;
  const dir = Math.sign(p.vy);
  if (dir === 0) return;
  if (dir > 0) {
    let ny = p.y, hit = false;
    forEachOverlappedTile((tx, ty) => {
      if (isSolid(tx, ty)) { ny = Math.min(ny, ty * TILE - p.h - 0.001); hit = true; }
    });
    if (hit) { p.y = ny; p.vy = 0; p.onGround = true; }
  } else {
    let ny = p.y, hit = false;
    forEachOverlappedTile((tx, ty) => {
      if (isSolid(tx, ty)) { ny = Math.max(ny, (ty + 1) * TILE + 0.001); hit = true; }
    });
    if (hit) { p.y = ny; p.vy = 0; } // bumped head
  }
}

function resetPlayerToSpawn() {
  const s = Game.level.spawn;
  player.x = s.x; player.y = s.y;
  player.vx = 0; player.vy = 0;
  player.onGround = false;
  player.coyote = 0; player.jumpBuffer = 0;
  player.facing = 1;
}

function spawnDeathBurst(cx, cy) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 4;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1.5,
      size: 3 + Math.random() * 4,
      life: 35 + Math.random() * 15,
      maxLife: 50,
      color: Math.random() < 0.5 ? COLORS.player : COLORS.danger,
    });
  }
}

function updateParticles() {
  for (const q of particles) {
    q.vy += 0.18;
    q.x += q.vx;
    q.y += q.vy;
    q.life--;
  }
  particles = particles.filter(q => q.life > 0);
}

/* ---- path recording -------------------------------------------------------
   Converts a recorded path (points every PATH_SAMPLE_EVERY frames, hitbox
   centers) to a deduplicated list of in-bounds tile cells {col, row}.      */
function pathToTiles(path) {
  const seen = new Set();
  const out = [];
  for (const pt of path) {
    const col = Math.floor(pt.x / TILE);
    const row = Math.floor(pt.y / TILE);
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) continue;
    const key = col + ',' + row;
    if (!seen.has(key)) {
      seen.add(key);
      out.push({ col, row });
    }
  }
  return out;
}

// Records one path sample (hitbox center) every PATH_SAMPLE_EVERY frames.
function samplePath() {
  const run = Game.run;
  run.pathTick++;
  if (run.pathTick % PATH_SAMPLE_EVERY !== 0) return;
  run.currentPath.push({
    x: player.x + player.w / 2,
    y: player.y + player.h / 2,
  });
}

/* The input after rules are applied (e.g. mirrorControls). Built fresh each
   playing update from the raw Input, so rules never mutate real key state. */
function buildEffectiveInput(game) {
  let eff = { left: Input.left, right: Input.right, jumpHeld: Input.jumpHeld };
  for (const rule of game.activeRules) {
    if (rule.modifyInput) eff = rule.modifyInput(eff, game) || eff;
  }
  return eff;
}

function updatePlayer(eff) {
  const p = player;

  // --- horizontal input: accelerate / friction ---
  const dir = (eff.right ? 1 : 0) - (eff.left ? 1 : 0);
  if (dir !== 0) {
    p.vx += dir * (p.onGround ? PHYS.accelGround : PHYS.accelAir);
    p.vx = Math.max(-PHYS.runSpeed, Math.min(PHYS.runSpeed, p.vx));
    p.facing = dir;
  } else {
    p.vx = approach(p.vx, 0, p.onGround ? PHYS.decelGround : PHYS.decelAir);
  }

  // --- coyote time & jump buffering ---
  if (p.onGround) p.coyote = PHYS.coyoteFrames;
  else if (p.coyote > 0) p.coyote--;

  if (Input.jumpPressed) p.jumpBuffer = PHYS.bufferFrames;
  else if (p.jumpBuffer > 0) p.jumpBuffer--;

  if (p.jumpBuffer > 0 && p.coyote > 0) {
    p.vy = PHYS.jumpVel;
    p.onGround = false;
    p.coyote = 0;
    p.jumpBuffer = 0;
    Game.justJumped = true; // rules (jumpShift) listen for this
  }

  // --- variable jump height: early release shortens the jump ---
  if (Input.jumpReleased && p.vy < 0) p.vy *= PHYS.jumpCut;

  // --- gravity with terminal velocity ---
  p.vy += PHYS.gravity;
  if (p.vy > PHYS.maxFall) p.vy = PHYS.maxFall;

  // --- integrate, one axis at a time ---
  p.x += p.vx;
  collideX();
  p.y += p.vy;
  p.onGround = false; // re-detected by collideY if we actually land
  collideY();

  // --- hazards (stop checking once we die this frame) ---
  let dead = false;

  // spikes from the ASCII grid (fair, shrunken hitbox)
  forEachOverlappedTile((tx, ty) => {
    if (dead || tileChar(tx, ty) !== '^') return;
    if (rectsOverlap(p.x, p.y, p.w, p.h,
                     tx * TILE + SPIKE_INSET_X, ty * TILE + SPIKE_INSET_TOP,
                     TILE - SPIKE_INSET_X * 2, TILE - SPIKE_INSET_TOP)) {
      dead = true;
      onPlayerDeath();
    }
  });

  // dynamic hazard layer (lava, added spikes, ...), separate from the grid
  if (!dead) {
    forEachOverlappedTile((tx, ty) => {
      if (dead || !Game.hazards.has(tx + ',' + ty)) return;
      dead = true;
      onPlayerDeath();
    });
  }

  // --- goal: the dynamic door at its CURRENT position ---
  if (!dead) {
    const d = Game.door;
    if (rectsOverlap(p.x, p.y, p.w, p.h, d.x, d.y, d.w, d.h)) onPlayerWin();
  }
}

/* =============================== RULES =================================== */
/* Registry of gameplay modifiers. A level lists rule ids in its `rules`
   array; every hook is optional:
     onLevelStart(game)      after the level (and all rule state) reset
     onAttemptStart(game)    on level load AND on every respawn/restart
     onUpdate(game)          each fixed update while playing
     modifyInput(input,game) transforms {left,right,jumpHeld} before physics
     onDraw(ctx,game)        draw world-layer effects (under the player)
     onDeath(game)           after the death point is recorded, before respawn
     onWin(game)             after lastWinPath is saved, before transition
   New rule later = one entry here + its id in a level's rules array.
   Per-level rule state lives in game.ruleVars.<ruleId> (reset on load).    */

const RULES = {
  /* Your previous winning path turns into lava. */
  pathLava: {
    onLevelStart(game) {
      const path = game.run.lastWinPath;
      if (!path || !path.length) return;
      const door = game.level.door; // the door's INITIAL tile (grid 'D')
      const st = game.level.spawnTile;
      const protectedTiles = new Set([
        door.tx + ',' + door.ty,           // the door itself
        (door.tx - 1) + ',' + door.ty,     // directly in front (approach side)
        door.tx + ',' + (door.ty + 1),     // the tile under the door
      ]);
      for (const t of pathToTiles(path)) {
        if (game.level.tiles[t.row][t.col] !== '.') continue;   // only empty cells
        if (protectedTiles.has(t.col + ',' + t.row)) continue;  // door stays open
        if (Math.max(Math.abs(t.col - st.col), Math.abs(t.row - st.row))
              <= SPAWN_SAFE_RADIUS) continue;                   // spawn stays safe
        game.hazards.set(t.col + ',' + t.row, 'lava');
      }
    },
    onDraw(ctx, game) {
      // pulsing lava: danger color at lower opacity + a brighter top strip
      const t = game.stateTime * 0.08;
      for (const [key, kind] of game.hazards) {
        if (kind !== 'lava') continue;
        const i = key.indexOf(',');
        const tx = +key.slice(0, i), ty = +key.slice(i + 1);
        const pulse = 0.45 + 0.18 * Math.sin(t + tx * 0.9 + ty * 1.7);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = COLORS.danger;
        ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
        ctx.globalAlpha = Math.min(1, pulse + 0.25);
        ctx.fillRect(tx * TILE, ty * TILE, TILE, 5); // hot surface line
      }
      ctx.globalAlpha = 1;
    },
  },

  /* A button opens the gate. Pressed state resets on respawn. */
  buttonGate: {
    onLevelStart(game) {
      game.gatesClosed = true;
      game.ruleVars.buttonGate = { pressed: false };
    },
    onAttemptStart(game) {
      game.gatesClosed = true;
      game.ruleVars.buttonGate = { pressed: false };
    },
    onUpdate(game) {
      const v = game.ruleVars.buttonGate;
      if (v.pressed) return;
      for (const b of game.level.buttons) {
        // the button hitbox: drawn rect sits on the floor of its tile
        if (rectsOverlap(player.x, player.y, player.w, player.h,
                         b.tx * TILE + 4, b.ty * TILE + 24, TILE - 8, 16)) {
          v.pressed = true;
          game.gatesClosed = false;
          Narrator.event(game, 'onButton');
          break;
        }
      }
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.buttonGate;
      // buttons: accent rectangle on the floor (sinks when pressed)
      for (const b of game.level.buttons) {
        const x = b.tx * TILE, y = b.ty * TILE;
        ctx.fillStyle = COLORS.accent;
        if (v.pressed) {
          ctx.globalAlpha = 0.8;
          ctx.fillRect(x + 4, y + 32, TILE - 8, 8);
        } else {
          ctx.fillRect(x + 4, y + 24, TILE - 8, 16);
          ctx.fillStyle = COLORS.bg;
          ctx.fillRect(x + 4, y + 24, TILE - 8, 3);
        }
        ctx.globalAlpha = 1;
      }
      // gate tiles: solid while closed, faint outline when open
      for (const g of game.level.gateTiles) {
        const x = g.tx * TILE, y = g.ty * TILE;
        if (game.gatesClosed) {
          ctx.fillStyle = COLORS.text;
          ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = COLORS.wall;
          ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
        } else {
          ctx.globalAlpha = 0.22;
          ctx.strokeStyle = COLORS.text;
          ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
          ctx.globalAlpha = 1;
        }
      }
    },
  },

  /* The door retires toward its target while you hold still. */
  shyDoor: {
    onLevelStart(game) {
      const t = game.level.def.doorTarget;
      game.ruleVars.shyDoor = {
        startX: game.door.x, startY: game.door.y,
        targetX: t.col * TILE, targetY: t.row * TILE,
        progress: 0,
        moving: false,
      };
    },
    onAttemptStart(game) {
      const v = game.ruleVars.shyDoor;
      v.progress = 0;
      v.moving = false;
      game.door.x = v.startX;
      game.door.y = v.startY;
    },
    onUpdate(game) {
      const v = game.ruleVars.shyDoor;
      const holdingStill = player.onGround && !Input.left && !Input.right;
      if (holdingStill && v.progress < 1) {
        v.progress = Math.min(1, v.progress + 1 / 360); // ~6 s full travel
      }
      v.moving = holdingStill && v.progress < 1;
      game.door.x = v.startX + (v.targetX - v.startX) * v.progress;
      game.door.y = v.startY + (v.targetY - v.startY) * v.progress;
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.shyDoor;
      if (!v.moving) return;
      const a = 0.35 + 0.3 * Math.sin(game.stateTime * 0.25);
      ctx.globalAlpha = a;
      ctx.strokeStyle = COLORS.door;
      ctx.lineWidth = 2;
      const d = game.door;
      ctx.strokeRect(d.x + 3, d.y + 3, d.w - 6, d.h - 6);
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1;
    },
  },

  /* Where you die, a spike grows (nearest unused slot, max 4 active). */
  deathSpike: {
    onLevelStart(game) {
      const door = game.level.door, st = game.level.spawnTile;
      game.ruleVars.deathSpike = {
        slots: game.level.sSlots.map(s => ({
          col: s.tx, row: s.ty,
          used: false,
          // runtime guard: slots too close to start/door can never activate
          allowed:
            Math.max(Math.abs(s.tx - st.col), Math.abs(s.ty - st.row)) > DEATH_SPIKE_SAFE &&
            Math.max(Math.abs(s.tx - door.tx), Math.abs(s.ty - door.ty)) > DEATH_SPIKE_SAFE,
        })),
        spikes: [], // FIFO of {key, col, row, born}
      };
    },
    onDeath(game) {
      const v = game.ruleVars.deathSpike;
      const d = game.run.deathPoints[game.run.deathPoints.length - 1];
      // nearest unused, allowed slot to the death point (tile centers)
      let best = null, bestDist = Infinity;
      for (const s of v.slots) {
        if (s.used || !s.allowed) continue;
        const dx = s.col * TILE + 20 - d.x;
        const dy = s.row * TILE + 20 - d.y;
        const dist = dx * dx + dy * dy;
        if (dist < bestDist) { bestDist = dist; best = s; }
      }
      if (!best) return;
      best.used = true;
      // cap: drop the oldest spike when exceeding the cap
      while (v.spikes.length >= DEATH_SPIKE_CAP) {
        const old = v.spikes.shift();
        game.hazards.delete(old.key);
      }
      const key = best.col + ',' + best.row;
      game.hazards.set(key, 'spike');
      v.spikes.push({ key, col: best.col, row: best.row, born: game.stateTime });
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.deathSpike;
      ctx.fillStyle = COLORS.danger;
      for (const s of v.spikes) {
        const pop = Math.min(1, (game.stateTime - s.born) / 6); // quick pop-in
        const h = 32 * pop;
        const x = s.col * TILE, yBase = s.row * TILE + TILE;
        ctx.beginPath();
        ctx.moveTo(x,      yBase); ctx.lineTo(x + 10, yBase - h); ctx.lineTo(x + 20, yBase);
        ctx.moveTo(x + 20, yBase); ctx.lineTo(x + 30, yBase - h); ctx.lineTo(x + 40, yBase);
        ctx.fill();
      }
    },
  },

  /* Every jump shifts all M stones one tile right (wrapping per lane). */
  jumpShift: {
    onLevelStart(game) {
      game.ruleVars.jumpShift = { pending: [], flashes: new Map() };
    },
    onAttemptStart(game) {
      game.ruleVars.jumpShift.pending = []; // drops delayed moves (stones stay put)
    },
    onUpdate(game) {
      const v = game.ruleVars.jumpShift;
      if (game.justJumped) {
        for (const lane of game.level.def.shiftLanes) {
          const cols = [];
          for (const key of game.mSolid) {
            const i = key.indexOf(',');
            const col = +key.slice(0, i), row = +key.slice(i + 1);
            if (row === lane.row && col >= lane.colStart && col <= lane.colEnd) cols.push(col);
          }
          // move rightmost first so a pair never eats its own neighbour
          cols.sort((a, b) => b - a);
          for (const col of cols) {
            const dest = col + 1 > lane.colEnd ? lane.colStart : col + 1;
            const fromKey = col + ',' + lane.row;
            const toKey = dest + ',' + lane.row;
            // blocked = destination still occupied (chains behind a stuck block)
            // or the player is in the way (anti-squash): retry on later frames
            if (game.mSolid.has(toKey) ||
                rectsOverlap(player.x, player.y, player.w, player.h,
                             dest * TILE, lane.row * TILE, TILE, TILE)) {
              v.pending.push({ fromKey, toKey });
              continue;
            }
            game.mSolid.delete(fromKey);
            game.mSolid.add(toKey);
            v.flashes.set(toKey, 14);
          }
        }
      }
      // retry delayed moves as soon as the destination is free and the player is clear
      for (let i = v.pending.length - 1; i >= 0; i--) {
        const m = v.pending[i];
        const ci = m.toKey.indexOf(',');
        const dCol = +m.toKey.slice(0, ci), dRow = +m.toKey.slice(ci + 1);
        if (game.mSolid.has(m.toKey)) continue; // destination still occupied
        if (rectsOverlap(player.x, player.y, player.w, player.h,
                         dCol * TILE, dRow * TILE, TILE, TILE)) continue;
        game.mSolid.delete(m.fromKey);
        game.mSolid.add(m.toKey);
        v.flashes.set(m.toKey, 14);
        v.pending.splice(i, 1);
      }
      for (const [k, f] of v.flashes) {
        if (f <= 1) v.flashes.delete(k); else v.flashes.set(k, f - 1);
      }
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.jumpShift;
      for (const key of game.mSolid) {
        const i = key.indexOf(',');
        const col = +key.slice(0, i), row = +key.slice(i + 1);
        const x = col * TILE, y = row * TILE;
        const flash = v.flashes.get(key) || 0;
        if (flash > 0) {
          ctx.fillStyle = COLORS.accent;
          ctx.fillRect(x, y, TILE, TILE);
          ctx.globalAlpha = flash / 14;
          ctx.fillRect(x - 2, y - 2, TILE + 4, TILE + 4);
          ctx.globalAlpha = 1;
        } else {
          ctx.fillStyle = COLORS.wall;
          ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = COLORS.accent;
          ctx.fillRect(x, y, TILE, 5);
        }
      }
    },
  },

  /* Left and right are swapped. */
  mirrorControls: {
    modifyInput(input) {
      const l = input.left;
      input.left = input.right;
      input.right = l;
      return input;
    },
  },
};

/* ============================= RENDERING ================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Scale the canvas with CSS to fit the window, keeping 16:9 (letterboxed).
function fitCanvas() {
  const s = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
  canvas.style.width = Math.floor(VIEW_W * s) + 'px';
  canvas.style.height = Math.floor(VIEW_H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// builds a canvas font string from a CONFIG.FONTS entry (size optionally overridden)
function fontStr(f, size) {
  return f.weight + ' ' + (size || f.size) + 'px ' + CONFIG.FONTS.family;
}

// Central text draw: THE one place that sets font, direction, color, alpha.
// A call-site `dir` overrides CONFIG.UI.direction (debug Persian smoke test).
function drawText(str, x, y, font, align, alpha, dir) {
  ctx.globalAlpha = (alpha === undefined ? 1 : alpha);
  ctx.font = font;
  ctx.direction = dir || CONFIG.UI.direction;
  ctx.textAlign = align;
  ctx.fillStyle = COLORS.text;
  ctx.fillText(str, x, y);
  ctx.globalAlpha = 1;
}

function roundedRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

// Debug-only Persian smoke test (P while debug mode is on). Deliberately NOT
// in STRINGS: it only verifies shaping + RTL rendering and never ships.
const PERSIAN_SMOKE = 'این یک آزمایش است. اتاق ۳ از ۳۰';
let persianSmoke = false;

// Shrink-to-fit, then wrap (at most TWO centered lines). Centralized so any
// future long narrator line behaves identically.
function fitNarrator(text, dir) {
  const U = CONFIG.UI.narrator, F = CONFIG.FONTS.narrator;
  ctx.direction = dir;
  const measure = (s, size) => { ctx.font = fontStr(F, size); return ctx.measureText(s).width; };
  let size = F.size;
  while (size > U.minSize && measure(text, size) > U.maxTextW) size--;
  if (measure(text, size) <= U.maxTextW) return { lines: [text], size };
  // still too wide at minSize: split at the most width-balanced word boundary
  const words = text.split(' ');
  if (words.length === 1) return { lines: [text], size };
  let best = null;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
    const w = Math.max(measure(a, size), measure(b, size));
    if (!best || w < best.w) best = { w, lines: [a, b] };
  }
  return { lines: best.lines, size };
}

// Narrator line in the reserved top-center band (rows 1-2), on a subtle
// rounded pill with a soft shadow. Visible for the whole level (no fading).
function drawNarrator() {
  const text = (persianSmoke && Game.debug) ? PERSIAN_SMOKE : Narrator.current;
  if (!text) return;
  const dir = (persianSmoke && Game.debug) ? 'rtl' : CONFIG.UI.direction;
  const U = CONFIG.UI.narrator;
  const fit = fitNarrator(text, dir);
  const lh = Math.round(fit.size * U.lineHeight);
  const font = fontStr(CONFIG.FONTS.narrator, fit.size);
  ctx.direction = dir; ctx.font = font;
  const textW = Math.max(...fit.lines.map(l => ctx.measureText(l).width));
  const blockH = fit.lines.length * lh;
  const pillW = Math.min(U.maxPillW, textW + U.padX * 2);
  const pillH = blockH + U.padY * 2;
  const pillX = U.x - pillW / 2, pillY = U.y - blockH / 2 - U.padY;
  // pill backdrop with a very soft shadow
  ctx.save();
  ctx.globalAlpha = U.pillAlpha;
  ctx.fillStyle = U.pillColor;
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 3;
  roundedRectPath(pillX, pillY, pillW, pillH, U.pillRadius);
  ctx.fill();
  ctx.restore();
  fit.lines.forEach((line, i) => {
    const baseY = U.y - blockH / 2 + lh * i + lh * 0.7; // blocks centered at U.y
    drawText(line, U.x, baseY, font, 'center', undefined, dir);
  });
}

function drawRoom() {
  const tiles = Game.level.tiles;
  ctx.fillStyle = COLORS.wall;
  for (let ty = 0; ty < ROWS; ty++)
    for (let tx = 0; tx < COLS; tx++)
      if (tiles[ty][tx] === '#')
        ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
}

function drawSpikes() {
  const tiles = Game.level.tiles;
  ctx.fillStyle = COLORS.danger;
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = 0; tx < COLS; tx++) {
      if (tiles[ty][tx] !== '^') continue;
      const x = tx * TILE, y = ty * TILE;
      ctx.beginPath();
      ctx.moveTo(x,      y + TILE); ctx.lineTo(x + 10, y + 10); ctx.lineTo(x + 20, y + TILE);
      ctx.moveTo(x + 20, y + TILE); ctx.lineTo(x + 30, y + 10); ctx.lineTo(x + 40, y + TILE);
      ctx.fill();
    }
  }
}

function drawDoor() {
  const d = Game.door;
  ctx.fillStyle = COLORS.door;
  ctx.fillRect(d.x + 6, d.y + 6, d.w - 12, d.h - 6);   // sits on tile bottom
  ctx.fillStyle = COLORS.bg;
  ctx.beginPath();
  ctx.arc(d.x + d.w - 13, d.y + 24, 2.5, 0, Math.PI * 2); // knob
  ctx.fill();
}

/* The ONLY place the player's look is defined. Replace this one function
   when the character art changes — physics (28x28 hitbox) stays untouched. */
function drawPlayer(ctx, player) {
  ctx.fillStyle = CONFIG.PLAYER.color;
  ctx.fillRect(Math.round(player.x), Math.round(player.y), player.w, player.h);
}

function drawParticles() {
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, q.life / q.maxLife);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
}

/* ---- debug view (F2) ---- */

function drawPathLine(path, color, alpha) {
  if (!path || path.length < 2) return;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
}

function drawDebug() {
  // paths
  drawPathLine(Game.run.lastWinPath, COLORS.door, 0.6);    // green: last win
  drawPathLine(Game.run.currentPath, COLORS.player, 0.45); // white: current

  // potential spike slots as faint outlines
  ctx.globalAlpha = 0.28;
  ctx.strokeStyle = COLORS.text;
  for (const s of Game.level.sSlots) {
    ctx.strokeRect(s.tx * TILE + 2.5, s.ty * TILE + 2.5, TILE - 5, TILE - 5);
  }
  ctx.globalAlpha = 1;

  // death points for this level as small x marks
  ctx.strokeStyle = COLORS.danger;
  ctx.lineWidth = 2;
  for (const d of Game.run.deathPoints) {
    if (d.level !== Game.levelIndex) continue;
    ctx.beginPath();
    ctx.moveTo(d.x - 5, d.y - 5); ctx.lineTo(d.x + 5, d.y + 5);
    ctx.moveTo(d.x + 5, d.y - 5); ctx.lineTo(d.x - 5, d.y + 5);
    ctx.stroke();
  }
  ctx.lineWidth = 1;

  // corner info: active rules + deaths
  const ids = Game.level.rules.slice();
  drawText(STRINGS.debug.rules(ids), CONFIG.UI.debugInfo.x, CONFIG.UI.debugInfo.yRules,
           fontStr(CONFIG.FONTS.debug), 'left', 0.8);
  drawText(STRINGS.debug.deaths(Game.deaths), CONFIG.UI.debugInfo.x, CONFIG.UI.debugInfo.yDeaths,
           fontStr(CONFIG.FONTS.debug), 'left', 0.8);
}

/* ---- HUD & overlays ---- */

function drawHUD() {
  drawText(STRINGS.hud.room(Game.levelIndex + 1, TOTAL_LEVELS),
           CONFIG.UI.hudRoom.x, CONFIG.UI.hudRoom.y,
           fontStr(CONFIG.FONTS.hud), 'left');
  drawText(STRINGS.hud.deaths(Game.deaths),
           CONFIG.UI.hudDeaths.x, CONFIG.UI.hudDeaths.y,
           fontStr(CONFIG.FONTS.hud), 'right');
}

function drawCompleteOverlay() {
  const a = Math.min(1, Game.stateTime / 15); // fade in
  ctx.fillStyle = COLORS.bg;
  ctx.globalAlpha = 0.72 * a;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.globalAlpha = 1;
  drawText(STRINGS.transitions.completeTitle, CONFIG.UI.complete.x, VIEW_H / 2 + CONFIG.UI.complete.titleYOff,
           fontStr(CONFIG.FONTS.overlay), 'center', a);
  drawText(STRINGS.transitions.completeSub, CONFIG.UI.complete.x, VIEW_H / 2 + CONFIG.UI.complete.subYOff,
           fontStr(CONFIG.FONTS.overlaySub), 'center', a);
}

function drawEndScreen() {
  const t = Game.stateTime, U = CONFIG.UI.end;
  drawText(STRINGS.end.title, U.x, VIEW_H / 2 + U.titleYOff,
           fontStr(CONFIG.FONTS.endTitle), 'center');
  drawText(STRINGS.end.sub, U.x, VIEW_H / 2 + U.subYOff,
           fontStr(CONFIG.FONTS.endLine), 'center', 0.9);
  drawText(STRINGS.end.deaths(Game.deaths), U.x, VIEW_H / 2 + U.deathsYOff,
           fontStr(CONFIG.FONTS.endLine), 'center');
  const pulse = 0.55 + 0.35 * Math.sin(t * 0.08);
  drawText(STRINGS.end.restart, U.x, VIEW_H / 2 + U.restartYOff,
           fontStr(CONFIG.FONTS.endLine), 'center', pulse);
}

function drawFlash() {
  if (Game.flash <= 0) return;
  ctx.globalAlpha = (Game.flash / FLASH_FRAMES) * 0.22;
  ctx.fillStyle = COLORS.danger;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.globalAlpha = 1;
}

function render() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  if (Game.state === 'end') {
    drawEndScreen();
    return;
  }
  drawRoom();
  drawSpikes();
  drawDoor();
  for (const rule of Game.activeRules) {
    if (rule.onDraw) rule.onDraw(ctx, Game);  // rule world effects
  }
  drawParticles();
  drawPlayer(ctx, player);
  if (Game.debug) drawDebug();
  drawHUD();
  if (Game.state === 'playing') drawNarrator(); // top-center band, never fades
  if (Game.state === 'complete') drawCompleteOverlay();
  drawFlash();
}

/* ============================ GAME STATE ================================= */
/* The Game object is the single source of truth. `run` holds everything
   tied to the current playthrough (paths + deaths across levels).          */

const Game = {
  state: 'playing',     // 'playing' | 'complete' | 'end'
  levelIndex: 0,
  deaths: 0,            // total deaths this run (HUD counter)
  attempt: 1,           // attempt number in the current room
  stateTime: 0,         // frames spent in the current state
  freeze: 0,            // hitstop frames after a death
  flash: 0,             // red flash frames after a death
  level: null,          // parsed level data (see loadLevel)
  activeRules: [],      // resolved rule objects of the current level
  ruleVars: {},         // per-level rule state, keyed by rule id (reset on load)
  hazards: new Map(),   // dynamic hazard layer: "col,row" -> 'lava' | 'spike'
  mSolid: new Set(),    // dynamic solid tiles from 'M' markers: "col,row"
  gatesClosed: true,    // 'G' tiles are solid while true
  door: { x: 0, y: 0, w: TILE, h: TILE }, // dynamic door entity (win target)
  justJumped: false,    // true during the update where a jump started
  debug: false,         // F2
  run: {
    currentPath: [],    // positions of the attempt in progress
    lastWinPath: [],    // positions of the last winning attempt (crosses levels)
    deathPoints: [],    // {x, y, level} of every death this run
    pathTick: 0,        // frame counter for sampling
  },
};

// Narrator system: picks the line for a level; event lines are swapped in
// by rules via the level's narratorEvents map.
const Narrator = {
  current: '',
  lineFor(levelIndex, context) {
    const entry = STRINGS.levels[levelIndex + 1];
    return entry ? entry.narrator : '';
  },
  event(game, name) {
    const map = game.level.narratorEvents;
    if (!map || !map[name]) return;
    const events = STRINGS.levels[game.levelIndex + 1].events || {};
    if (events[map[name]]) Narrator.current = events[map[name]];
  },
};

function setState(s) {
  Game.state = s;
  Game.stateTime = 0;
}

// attempt start: fresh narrator line + per-attempt rule state
function attemptStart(game) {
  Narrator.current = Narrator.lineFor(game.levelIndex, game);
  for (const rule of game.activeRules) {
    if (rule.onAttemptStart) rule.onAttemptStart(game);
  }
}

function loadLevel(index) {
  const def = LEVELS[index];
  const parsed = parseLevelGrid(def.grid);
  Game.levelIndex = index;
  Game.level = {
    def,              // the level definition (doorTarget, shiftLanes, ...)
    name: def.name,
    tiles: def.grid.slice(),
    spawn: parsed.spawn,
    door: parsed.door,          // door TILE (initial position; protections use it)
    spawnTile: parsed.spawnTile,
    buttons: parsed.buttons,
    gateTiles: parsed.gateTiles,
    sSlots: parsed.sSlots,
    rules: def.rules,
    narratorEvents: def.narratorEvents || null,
  };
  // theme
  COLORS = CONFIG.THEMES[def.act || 1] || CONFIG.THEMES[1];
  // clean slate for the new level: no state leaks between rooms
  Game.hazards = new Map();
  Game.mSolid = new Set(parsed.mTiles.map(t => t.tx + ',' + t.ty));
  Game.gatesClosed = true;
  Game.ruleVars = {};
  Game.door = { x: parsed.door.tx * TILE, y: parsed.door.ty * TILE, w: TILE, h: TILE };
  Game.justJumped = false;
  Game.activeRules = def.rules
    .map(id => RULES[id] || console.warn('Unknown rule id:', id))
    .filter(Boolean);
  Game.freeze = 0;
  Game.flash = 0;
  particles = [];
  resetPlayerToSpawn();
  // starting a new attempt's path (lastWinPath & deathPoints persist)
  Game.run.currentPath = [];
  Game.run.pathTick = 0;
  for (const rule of Game.activeRules) {
    if (rule.onLevelStart) rule.onLevelStart(Game);
  }
  attemptStart(Game);
  setState('playing');
}

// Back to the spawn point. died=true counts a death + effects; died=false is
// a manual restart (R) with no death penalty. Either way a new attempt starts
// with an empty currentPath.
function restartAttempt(died) {
  if (died) {
    // record the death point of the attempt that just ended
    Game.run.deathPoints.push({
      x: player.x + player.w / 2,
      y: player.y + player.h / 2,
      level: Game.levelIndex,
    });
    for (const rule of Game.activeRules) {
      if (rule.onDeath) rule.onDeath(Game);
    }
    Game.deaths++;
    Game.flash = FLASH_FRAMES;
    Game.freeze = DEATH_FREEZE_FRAMES;
    spawnDeathBurst(player.x + player.w / 2, player.y + player.h / 2);
  }
  Game.run.currentPath = [];
  Game.run.pathTick = 0;
  resetPlayerToSpawn();
  Game.attempt++;
  attemptStart(Game); // per-attempt state resets on respawn
}

function onPlayerDeath() {
  restartAttempt(true);
}

function onPlayerWin() {
  // save THIS attempt's path before the next level loads
  Game.run.lastWinPath = Game.run.currentPath.slice();
  for (const rule of Game.activeRules) {
    if (rule.onWin) rule.onWin(Game);
  }
  setState('complete');
}

function resetRun() {
  Game.deaths = 0;
  Game.attempt = 1;
  Game.run.currentPath = [];
  Game.run.lastWinPath = [];
  Game.run.deathPoints = [];
  Game.run.pathTick = 0;
  loadLevel(0);
}

// One fixed update (1/60 s).
function update() {
  Game.stateTime++;
  if (Game.flash > 0) Game.flash--;

  // F2 toggles debug mode
  if (Input.debugToggle) {
    Game.debug = !Game.debug;
    if (!Game.debug) persianSmoke = false; // the smoke test belongs to debug view only
  }

  // P toggles the Persian smoke-test string in the narrator slot (debug only)
  if (Input.persianToggle && Game.debug) persianSmoke = !persianSmoke;

  // debug-only level jumps: N = next, 1..6 = straight to that room
  if (Game.debug && Game.state === 'playing') {
    if (Input.debugSkip) {
      if (Game.levelIndex + 1 < LEVELS.length) loadLevel(Game.levelIndex + 1);
      else setState('end');
    } else if (Input.debugDigit >= 1 && Input.debugDigit <= LEVELS.length) {
      loadLevel(Input.debugDigit - 1);
    }
  }

  // R: restart attempt while playing, restart the whole run on the end screen
  if (Input.restartPressed) {
    if (Game.state === 'playing') restartAttempt(false);
    else if (Game.state === 'end') resetRun();
  }

  switch (Game.state) {
    case 'playing':
      if (Game.freeze > 0) {
        Game.freeze--; // death hitstop; player is already back at spawn
      } else {
        const eff = buildEffectiveInput(Game);
        Game.justJumped = false;
        updatePlayer(eff);
        for (const rule of Game.activeRules) {
          if (rule.onUpdate) rule.onUpdate(Game);
        }
        samplePath();
      }
      break;
    case 'complete':
      if (Game.stateTime >= COMPLETE_FRAMES) {
        if (Game.levelIndex + 1 < LEVELS.length) loadLevel(Game.levelIndex + 1);
        else setState('end'); // only the rooms above exist so far
      }
      break;
    case 'end':
      break;
  }

  updateParticles();

  // one-frame input edges are consumed every update
  Input.jumpPressed = false;
  Input.jumpReleased = false;
  Input.restartPressed = false;
  Input.debugToggle = false;
  Input.debugSkip = false;
  Input.debugDigit = 0;
  Input.persianToggle = false;
}

/* ============================= MAIN LOOP ================================= */
/* Fixed timestep at 60 updates/s: accumulate real elapsed time, run whole
   steps. Rendering happens once per requestAnimationFrame.                 */

let lastTime = performance.now();
let accumulator = 0;

function frame(now) {
  let delta = now - lastTime;
  lastTime = now;
  if (delta > 250) delta = 250; // tab was hidden etc.: don't fast-forward
  accumulator += delta;

  let steps = 0;
  while (accumulator >= STEP_MS && steps < MAX_STEPS) {
    update();
    accumulator -= STEP_MS;
    steps++;
  }
  if (steps === MAX_STEPS) accumulator = 0; // drop leftover time, stay in sync

  render();
  requestAnimationFrame(frame);
}

loadLevel(0);
requestAnimationFrame(frame);
</script>
</body>
