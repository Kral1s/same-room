           roomX, ui.hudRoom.y, fontStr(activeFonts().hud), roomAlign);
  drawText(S().hud.deaths(Game.deaths),
           deathsX, ui.hudDeaths.y, fontStr(activeFonts().hud), deathsAlign);
}

// win animation (pure cosmetics): the player shrinks into the door opening
// (ease-in), then one soft teal ring expands and fades. Fits inside the
// existing COMPLETE_FRAMES transition; the hitbox and path are untouched.
function drawWinFx() {
  const D = CONFIG.DOOR;
  const t = Game.stateTime - winFx.t0;   // complete-state clock (t0 = 0 by convention)
  const doorCx = Game.door.x + Game.door.w / 2, doorCy = Game.door.y + Game.door.h / 2;
  const cx0 = winFx.x0 + player.w / 2, cy0 = winFx.y0 + player.h / 2;
  if (t < D.winShrinkFrames) {
    const u = t / D.winShrinkFrames, e = u * u;          // ease-in
    drawPlayer(ctx, player, {
      scale: Math.max(0, 1 - e),
      offsetX: (doorCx - cx0) * e,
      offsetY: (doorCy - cy0) * e,
    });
  } else if (t < D.winShrinkFrames + D.winRingFrames) {
    const u = (t - D.winShrinkFrames) / D.winRingFrames; // ring: 0..1
    ctx.globalAlpha = Math.max(0, 0.8 * (1 - u));
    ctx.strokeStyle = D.winRingColor;
    ctx.lineWidth = Math.max(0.5, 2.5 - u);
    ctx.beginPath();
    ctx.arc(doorCx, doorCy, 4 + D.winRingMaxR * u, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
  }
}

function drawCompleteOverlay() {
  const a = Math.min(1, Game.stateTime / 15); // fade in
  ctx.fillStyle = COLORS.bg;
  ctx.globalAlpha = 0.72 * a;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.globalAlpha = 1;
  drawText(S().transitions.completeTitle, CONFIG.UI.complete.x, VIEW_H / 2 + CONFIG.UI.complete.titleYOff,
           fontStr(activeFonts().overlay), 'center', a);
  drawText(S().transitions.completeSub, CONFIG.UI.complete.x, VIEW_H / 2 + CONFIG.UI.complete.subYOff,
           fontStr(activeFonts().overlaySub), 'center', a);
}

function drawEndScreen() {
  const t = Game.stateTime, U = CONFIG.UI.end;
  drawText(S().end.title, U.x, VIEW_H / 2 + U.titleYOff,
           fontStr(activeFonts().endTitle), 'center');
  drawText(S().end.sub, U.x, VIEW_H / 2 + U.subYOff,
           fontStr(activeFonts().endLine), 'center', 0.9);
  drawText(S().end.deaths(Game.deaths), U.x, VIEW_H / 2 + U.deathsYOff,
           fontStr(activeFonts().endLine), 'center');
  const pulse = 0.55 + 0.35 * Math.sin(t * 0.08);
  drawText(S().end.restart, U.x, VIEW_H / 2 + U.restartYOff,
           fontStr(activeFonts().endLine), 'center', pulse);
}

function drawFlash() {
  if (Game.flash <= 0) return;
  ctx.globalAlpha = (Game.flash / FLASH_FRAMES) * 0.22;
  ctx.fillStyle = COLORS.danger;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.globalAlpha = 1;
}

function drawSoundIndicator() {
  if (save.sound && performance.now() > Game.soundIconUntil) return;
  const x = VIEW_W - 32, y = VIEW_H - 26;
  ctx.save();
  ctx.globalAlpha = 0.78;
  ctx.fillStyle = save.sound ? COLORS.door : COLORS.danger;
  ctx.strokeStyle = ctx.fillStyle;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y - 4); ctx.lineTo(x + 5, y - 4); ctx.lineTo(x + 11, y - 9);
  ctx.lineTo(x + 11, y + 9); ctx.lineTo(x + 5, y + 4); ctx.lineTo(x, y + 4);
  ctx.closePath(); ctx.fill();
  if (save.sound) {
    ctx.beginPath(); ctx.arc(x + 10, y, 7, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 10, y, 11, -0.9, 0.9); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(x + 15, y - 7); ctx.lineTo(x + 25, y + 7);
    ctx.moveTo(x + 25, y - 7); ctx.lineTo(x + 15, y + 7); ctx.stroke();
  }
  ctx.restore();
}

function render() {
  if (Game.mode !== 'playing') {
    renderMenuScreen();
    drawSoundIndicator();
    return;
  }
  // render order: static background (offscreen act layer) -> dynamic living
  // wall -> tiles/walls/hazards -> entities -> player -> narrator pill + HUD
  drawStaticBG();

  if (Game.state === 'end') {
    drawEndScreen();
    drawSoundIndicator();
    return;
  }
  drawDynamicBG();
  drawRoom();
  drawSpikes();
  drawDoor();
  for (const rule of Game.activeRules) {
    if (rule.onDraw) rule.onDraw(ctx, Game);  // rule world effects
  }
  drawParticles();
  // during the win animation the real player stays put, but its DRAWING is
  // replaced by the shrink-into-the-door phantom (see drawWinFx).
  // When gravity is inverted (level 8) the sprite is ceiling-anchored via the
  // existing flipY opt; with gravityDir === 1 opts stay empty = same drawing.
  let playerLook = (Game.gravityDir === -1) ? { flipY: true } : undefined;
  // noRepeatDirection (level 11): on a blocked press the DRAWN player makes a
  // quick +-3px damped horizontal shake (~130 ms) — pure cosmetics, the real
  // hitbox never moves.
  const nrd = Game.ruleVars.noRepeatDirection;
  if (nrd && Game.state === 'playing' && Game.stateTime < nrd.shakeUntil) {
    const k = (8 - (nrd.shakeUntil - Game.stateTime)) / 8; // 0..1
    (playerLook || (playerLook = {})).offsetX =
      Math.round(3 * Math.sin(k * Math.PI * 4) * (1 - k));
  }
  if (!(Game.state === 'complete' && winFx.started))
    drawPlayer(ctx, player, playerLook);
  if (Game.debug) drawDebug();
  drawHUD();
  if (Game.state === 'playing') drawNarrator(); // top-center band, never fades
  if (Game.state === 'complete') drawCompleteOverlay();
  if (Game.state === 'complete' && winFx.started) drawWinFx(); // above the overlay
  drawFlash();
  drawSoundIndicator();
}

/* ============================ GAME STATE ================================= */
/* The Game object is the single source of truth. `run` holds everything
   tied to the current playthrough (paths + deaths across levels).          */

const Game = {
  mode: 'menu',         // 'menu' | 'playing' | 'levels' | 'options' | 'quitConfirm' | 'farewell'
  state: 'playing',     // 'playing' | 'complete' | 'end'
  levelIndex: 0,
  deaths: 0,            // total deaths this run (HUD counter)
  levelDeaths: 0,       // deaths in the CURRENT level (living-wall tally marks)
  attempt: 1,           // attempt number in the current room
  stateTime: 0,         // frames spent in the current state
  freeze: 0,            // hitstop frames after a death
  flash: 0,             // red flash frames after a death
  level: null,          // parsed level data (see loadLevel)
  activeRules: [],      // resolved rule objects of the current level
  ruleVars: {},         // per-level rule state, keyed by rule id (reset on load)
  hazards: new Map(),   // dynamic hazard layer: "col,row" -> 'lava' | 'spike'
  mSolid: new Set(),    // dynamic solid tiles from 'M' markers: "col,row"
  gatesClosed: true,    // 'G' tiles are solid while true
  door: { x: 0, y: 0, w: TILE, h: TILE }, // dynamic door entity (win target)
  justJumped: false,    // true during the update where a jump started
  gravityDir: 1,        // 1 = down, -1 = inverted (gravityFlip rule; verified
                        // identical physics while 1, so levels 1-6 unchanged)
  gravityFlipOn: false, // cached: current level uses the gravityFlip rule
  keysSwapped: false,   // swapKeysOnJump rule: left/right exchanged while true
  lastMoveDir: null,    // noRepeatDirection rule: null / -1 / 1
  inputDelayOn: false,  // cached: current level uses the inputDelay rule
  timeScale: 1,         // room-time multiplier applied this frame (debug view)
  lastDeathCause: null,  // 'spike' | 'hazard' | 'ghost' (set at the kill site)
  audioDeathCause: null, // audio-only cause; does not affect rule/gameplay logic
  audioStepTimer: 0, audioStepSide: 1,
  soundIconUntil: 0, audioLastAudition: '',
  endChordPlayed: false,
  // --- Act 3 attempt recording (ghost system) ---
  attemptRec: [],       // flat [x0,y0,x1,y1,...] hitbox-center tape, THIS attempt
  attemptFrame: 0,      // frames since the current attempt started
  pastAttempts: [],     // finished tapes (newest last, cap 6; wins never stored)
  debug: false,         // F2
  run: {
    currentPath: [],    // positions of the attempt in progress
    lastWinPath: [],    // positions of the last winning attempt (crosses levels)
    deathPoints: [],    // {x, y, level} of every death this run
    pathTick: 0,        // frame counter for sampling
  },
};

// Narrator system: picks the line for a level; event lines are swapped in
// by rules via the level's narratorEvents map.
const Narrator = {
  current: '',
  currentEvent: null,
  lineFor(levelIndex, context) {
    const entry = S().levels[levelIndex + 1];
    return entry ? entry.narrator : '';
  },
  event(game, name) {
    const map = game.level.narratorEvents;
    if (!map || !map[name]) return;
    const entry = S().levels[game.levelIndex + 1];
    const events = entry ? (entry.events || {}) : {};
    if (events[map[name]]) {
      const next = events[map[name]];
      if (next !== Narrator.current) AUDIO.play('narrator_tick');
      Narrator.current = next;
      Narrator.currentEvent = name;
    }
  },
  refresh() {
    const entry = S().levels[Game.levelIndex + 1];
    if (!entry) { Narrator.current = ''; return; }
    const map = Game.level && Game.level.narratorEvents;
    const key = Narrator.currentEvent && map && map[Narrator.currentEvent];
    Narrator.current = (key && entry.events && entry.events[key])
      ? entry.events[key] : (entry.narrator || '');
  },
};

function setLanguage(lang) {
  CONFIG.LANG = lang === 'en' ? 'en' : 'fa';
  CONFIG.UI.direction = CONFIG.LANG === 'fa' ? 'rtl' : 'ltr';
  if (document.documentElement) document.documentElement.lang = CONFIG.LANG;
  document.title = S().title;
  if (Game.level) Narrator.refresh();
  save.lang = CONFIG.LANG;
  persistSave();
}

function setState(s) {
  Game.state = s;
  Game.stateTime = 0;
}

function enterEndState() {
  setState('end');
  if (!Game.endChordPlayed) {
    Game.endChordPlayed = true;
    AUDIO.play('end_chord');
  }
}

// attempt start: fresh narrator line + per-attempt rule state
function attemptStart(game) {
  Narrator.currentEvent = null;
  Narrator.current = Narrator.lineFor(game.levelIndex, game);
  for (const rule of game.activeRules) {
    if (rule.onAttemptStart) rule.onAttemptStart(game);
  }
  for (const rule of game.activeRules) {
    if (rule.onRespawn) rule.onRespawn(game); // level load AND every respawn/R
  }
}

function loadLevel(index) {
  const def = LEVELS[index];
  const parsed = parseLevelGrid(def.grid);
  Game.levelIndex = index;
  Game.level = {
    def,              // the level definition (doorTarget, shiftLanes, ...)
    name: def.name,
    tiles: def.grid.slice(),
    spawn: parsed.spawn,
    door: parsed.door,          // door TILE (initial position; protections use it)
    spawnTile: parsed.spawnTile,
    buttons: parsed.buttons,
    buttons2: parsed.buttons2,
    gateTiles: parsed.gateTiles,
    sSlots: parsed.sSlots,
    rules: def.rules,
    narratorEvents: def.narratorEvents || null,
  };
  // theme
  COLORS = CONFIG.THEMES[def.act || 1] || CONFIG.THEMES[1];
  // background: repaint the static act layer (only happens on level load),
  // reset the living wall, reset this level's death tally
  renderStaticBG(def.act || 1);
  resetBGWall();
  Game.levelDeaths = 0;
  winFx.started = false; // win FX belongs to the completed room only
  // clean slate for the new level: no state leaks between rooms
  Game.hazards = new Map();
  // cached spike cells ('^' and 'v') for the player's danger-eyes (visual only)
  staticDangerTiles = [];
  for (let ty = 0; ty < ROWS; ty++)
    for (let tx = 0; tx < COLS; tx++)
      if (def.grid[ty][tx] === '^' || def.grid[ty][tx] === 'v')
        staticDangerTiles.push({ c: tx, r: ty });
  Game.mSolid = new Set(parsed.mTiles.map(t => t.tx + ',' + t.ty));
  Game.gatesClosed = true;
  Game.gravityFlipOn = def.rules.includes('gravityFlip'); // cached rule flag
  Game.inputDelayOn = def.rules.includes('inputDelay');   // cached rule flag
  Game.ruleVars = {};
  Game.door = { x: parsed.door.tx * TILE, y: parsed.door.ty * TILE, w: TILE, h: TILE };
  Game.justJumped = false;
  Game.lastDeathCause = null;
  Game.audioDeathCause = null;
  Game.activeRules = def.rules
    .map(id => RULES[id] || console.warn('Unknown rule id:', id))
    .filter(Boolean);
  Game.freeze = 0;
  Game.flash = 0;
  particles = [];
  resetPlayerToSpawn();
  // starting a new attempt's path (lastWinPath & deathPoints persist)
  Game.run.currentPath = [];
  Game.run.pathTick = 0;
  // Act 3: stored tapes never carry over to another level; fresh attempt tape
  Game.pastAttempts.length = 0;
  Game.attemptRec.length = 0;
  Game.attemptFrame = 0;
  for (const rule of Game.activeRules) {
    if (rule.onLevelStart) rule.onLevelStart(Game);
  }
  attemptStart(Game);
  setState('playing');
  AUDIO.play('room');
}

// Back to the spawn point. died=true counts a death + effects; died=false is
// a manual restart (R) with no death penalty. Either way a new attempt starts
// with an empty currentPath.
function restartAttempt(died) {
  endAttemptRecording(); // the attempt that just ended (death or R)
  if (died) {
    // record the death point of the attempt that just ended
    Game.run.deathPoints.push({
      x: player.x + player.w / 2,
      y: player.y + player.h / 2,
      level: Game.levelIndex,
    });
    for (const rule of Game.activeRules) {
      if (rule.onDeath) rule.onDeath(Game);
    }
    Game.deaths++;
    const tallyBefore = Math.min(Game.levelDeaths + bgFakeTally, CONFIG.BG.tally.max);
    Game.levelDeaths++;
    const tallyAfter = Math.min(Game.levelDeaths + bgFakeTally, CONFIG.BG.tally.max);
    if (CONFIG.AUDIO.tallyScratch && tallyAfter > tallyBefore)
      AUDIO.play('tally_scratch', { delay: 0.14 });
    recordSavedDeath(Game.levelIndex);
    Game.flash = FLASH_FRAMES;
    Game.freeze = DEATH_FREEZE_FRAMES;
    spawnDeathBurst(player.x + player.w / 2, player.y + player.h / 2);
  }
  Game.run.currentPath = [];
  Game.run.pathTick = 0;
  Game.attemptRec.length = 0; // fresh tape for the new attempt
  Game.attemptFrame = 0;
  resetPlayerToSpawn();
  Game.attempt++;
  attemptStart(Game); // per-attempt state resets on respawn
}

function onPlayerDeath() {
  const cause = Game.audioDeathCause ||
    (Game.lastDeathCause === 'ghost' ? 'ghost' : 'generic');
  const sound = cause === 'spike' ? 'death_spike'
    : cause === 'lava' ? 'death_lava'
    : cause === 'ghost' ? 'death_ghost' : 'death';
  AUDIO.play(sound, { pan: audioPanForX(player.x + player.w / 2) });
  Game.audioDeathCause = null;
  restartAttempt(true);
}

// win animation state (VISUAL ONLY — never read by physics or win detection;
// when CONFIG.DOOR.winAnim is false it never activates and the game behaves
// exactly as before)
let winFx = { started: false, t0: 0, x0: 0, y0: 0 };

function onPlayerWin() {
  AUDIO.play('portal', {
    duration: (CONFIG.DOOR.winShrinkFrames + CONFIG.DOOR.winRingFrames) * STEP_MS / 1000,
    pan: audioPanForX(Game.door.x + Game.door.w / 2),
  });
  // Save the path and progression before the next level loads; the persisted
  // tile route is used when a player later starts a level directly.
  Game.run.lastWinPath = Game.run.currentPath.slice();
  recordSavedWin(Game.levelIndex, Game.run.currentPath);
  if (CONFIG.DOOR.winAnim)              // visual-only win effect (default on)
    winFx = { started: true, t0: 0, x0: player.x, y0: player.y };
  // note: t0 is 0 because setState('complete') above resets stateTime to 0;
  // the FX runs on the complete-state clock, not the playing-state clock
  for (const rule of Game.activeRules) {
    if (rule.onWin) rule.onWin(Game);
  }
  setState('complete');
}

function resetRun() {
  Game.deaths = 0;
  Game.attempt = 1;
  Game.endChordPlayed = false;
  Game.run.currentPath = [];
  Game.run.lastWinPath = [];
  Game.run.deathPoints = [];
  Game.run.pathTick = 0;
  loadLevel(0);
}

function debugLoadLevel(index) {
  if (!Number.isInteger(index) || index < 0 || index >= LEVELS.length) return false;
  if (dependsOnPrevious(index + 1)) {
    let prior = priorPathForLevel(index);
    if (!prior.length && Game.levelIndex === index - 1 && Game.run.currentPath.length)
      prior = Game.run.currentPath.slice();
    Game.run.lastWinPath = prior;
  }
  loadLevel(index);
  return true;
}

const Menu = {
  screen: 'main',
  origin: 'initial', // initial | paused | end
  selected: 0,
  narrator: '',
  dependencyPendingIndex: null,
  dependencyDeadline: 0,
};

const MENU_MAIN_ITEMS = ['continue', 'start', 'levels', 'options', 'quit'];

function toggleSoundSetting() {
  save.sound = !save.sound;
  persistSave();
  AUDIO.setMuted(!save.sound);
  Game.soundIconUntil = performance.now() + 1500;
  if (save.sound) AUDIO.play('mute_blip');
  if (Game.mode === 'options' && Menu.selected === 2)
    Menu.narrator = save.sound ? S().menu.nSoundOn : S().menu.nSoundOff;
}

function clearInputState() {
  Input.left = Input.right = Input.jumpHeld = false;
  Input.jumpPressed = Input.jumpReleased = Input.restartPressed = false;
  Input.debugToggle = Input.debugSkip = Input.debugPrev = Input.debugNext = false;
  Input.debugDigit = 0;
  Input.languageToggle = Input.tallyToggle = false;
}

function resetLoopClock() {
  accumulator = 0;
  lastTime = performance.now();
}

function toggleFullscreen() {
  try {
    let result = null;
    if (document.fullscreenElement) {
      if (document.exitFullscreen) result = document.exitFullscreen();
    } else if (canvas.requestFullscreen) {
      result = canvas.requestFullscreen();
    }
    if (result && typeof result.catch === 'function') result.catch(() => {});
  } catch (e) {
    // Fullscreen can be unavailable in restricted browser/iframe contexts.
  }
}

function openMainMenu(origin) {
  clearInputState();
  AUDIO.play('ui_open');
  Menu.dependencyPendingIndex = null;
  Menu.dependencyDeadline = 0;
  Menu.origin = origin || 'initial';
  Menu.screen = 'main';
  Menu.selected = 0;
  Menu.narrator = origin === 'paused' ? S().menu.nContinue : '';
  Game.mode = 'menu';
  resetLoopClock();
}

function openMenu() {
  if (Game.mode !== 'playing') return;
  if (Game.state === 'end') {
    openMainMenu('end');
    return;
  }
  if (Game.state === 'playing') {
    setSavedCurrent(Game.levelIndex);
    persistSave();
  }
  openMainMenu('paused');
}

function returnToMainMenu() {
  const farewell = S().menu.nFarewell;
  const origin = Menu.origin || 'initial';
  openMainMenu(origin);
  Menu.narrator = farewell;
}

function enterMenuScreen(screen) {
  clearInputState();
  if (screen === 'main') {
    Menu.dependencyPendingIndex = null;
    Menu.dependencyDeadline = 0;
    AUDIO.play('ui_back');
  } else if (screen !== Game.mode) AUDIO.play('ui_open');
  Menu.screen = screen;
  Game.mode = screen === 'main' ? 'menu' : screen;
  resetLoopClock();
}

function mainItemNarrator(index) {
  const m = S().menu;
  const lines = [m.nContinue, m.nStart, m.nLevels, m.nOptions, m.nQuit];
  return lines[index] || '';
}

function isLevelUnlocked(index) {
  if (!Number.isInteger(index) || index < 0 || index >= LEVELS.length) return false;
  return CONFIG.UNLOCK_ALL || index + 1 <= save.highest;
}

function levelMenuNarrator(index) {
  if (dependsOnPrevious(index + 1)) return S().menu.nDepends;
  return isLevelUnlocked(index) ? S().menu.nLevels : S().menu.nLocked;
}

function beginDependencyRedirect(index) {
  Menu.selected = index;
  Menu.narrator = S().menu.nDepends;
  Menu.dependencyPendingIndex = index;
  Menu.dependencyDeadline = performance.now() + 900;
  clearInputState();
  AUDIO.play('ui_depends');
}

function updateMenuDependencyWait(now) {
  if (Menu.dependencyPendingIndex === null || document.hidden ||
      now < Menu.dependencyDeadline) return;
  const requested = Menu.dependencyPendingIndex;
  Menu.dependencyPendingIndex = null;
  Menu.dependencyDeadline = 0;
  startAtLevel(precedingNonDependentIndex(requested));
}

function mainItemRect(index) {
  const M = CONFIG.MENU;
  return {
    x: (VIEW_W - M.itemW) / 2,
    y: M.itemStartY - M.itemH / 2 + index * M.itemGap,
    w: M.itemW,
    h: M.itemH,
  };
}

function levelCellRect(index) {
  const M = CONFIG.MENU;
  const cols = M.levelsCols;
  const totalW = cols * M.cellSize + (cols - 1) * M.cellGap;
  const visualCol = CONFIG.LANG === 'fa' ? cols - 1 - (index % cols) : index % cols;
  const row = Math.floor(index / cols);
  return {
    x: (VIEW_W - totalW) / 2 + visualCol * (M.cellSize + M.cellGap),
    y: M.levelsStartY + row * (M.cellSize + M.cellGap),
    w: M.cellSize,
    h: M.cellSize,
  };
}

function optionsLanguageRect(language) {
  const rtl = CONFIG.LANG === 'fa';
  const center = language === 'en'
    ? (rtl ? VIEW_W * 0.64 : VIEW_W * 0.36)
    : (rtl ? VIEW_W * 0.36 : VIEW_W * 0.64);
  return { x: center - 170, y: CONFIG.MENU.optionsStartY - 8,
           w: 340, h: 64 };
}

function optionsSoundRect() {
  return { x: VIEW_W / 2 - 170, y: 414, w: 340, h: 64 };
}

function quitChoiceRect(index) {
  const M = CONFIG.MENU;
  const centerX = index === 0 ? VIEW_W / 2 - 150 : VIEW_W / 2 + 150;
  return { x: centerX - M.quitItemW / 2,
           y: M.quitStartY - M.quitItemH / 2 + index * M.quitGap,
           w: M.quitItemW, h: M.quitItemH };
}

function backButtonRect(y) {
  return { x: (VIEW_W - 300) / 2, y: y - 28, w: 300, h: 56 };
}

function startAtLevel(index, options) {
  const opts = options || {};
  if (!isLevelUnlocked(index)) {
    Menu.narrator = S().menu.nLocked;
    return false;
  }
  if (dependsOnPrevious(index + 1) && !opts.allowDependent) {
    Menu.narrator = S().menu.nDepends;
    return false;
  }
  const previous = Array.isArray(opts.priorPath) ? opts.priorPath.slice() : [];
  Game.deaths = 0;
  Game.attempt = 1;
  Game.endChordPlayed = false;
  Game.run.currentPath = [];
  Game.run.lastWinPath = previous;
  Game.run.deathPoints = [];
  Game.run.pathTick = 0;
  setSavedCurrent(index);
  persistSave();
  Menu.screen = 'main';
  Menu.dependencyPendingIndex = null;
  clearInputState();
  AUDIO.play('ui_close');
  AUDIO.setMuffled(false);
  loadLevel(index);
  Game.mode = 'playing';
  resetLoopClock();
  return true;
}

function continueFromMenu() {
  if (Menu.origin === 'paused' && Game.state !== 'end') {
    Menu.narrator = S().menu.nContinue;
    clearInputState();
    AUDIO.play('ui_close');
    AUDIO.setMuffled(false);
    Game.mode = 'playing';
    resetLoopClock();
    return;
  }
  const highestPlayable = Math.max(1, Math.min(LEVELS.length,
    Number(save.highest) || 1));
  const index = Math.max(0, Math.min(LEVELS.length - 1, highestPlayable - 1,
    (Number(save.current) || 1) - 1));
  if (dependsOnPrevious(index + 1)) {
    if (canContinueDependent(index)) {
      return startAtLevel(index, {
        allowDependent: true,
        priorPath: savedTilesToPath(save.tiles[index - 1]),
      });
    }
    return startAtLevel(precedingNonDependentIndex(index));
  }
  return startAtLevel(index);
}

function activateMainSelection(index) {
  Menu.selected = index;
  AUDIO.play('ui_select');
  Menu.narrator = mainItemNarrator(index);
  switch (index) {
    case 0: continueFromMenu(); break;
    case 1: startAtLevel(0); break;
    case 2:
      Menu.selected = Math.max(0, Math.min(CONFIG.TOTAL_LEVELS - 1,
        (Number(save.current) || 1) - 1));
      enterMenuScreen('levels');
      Menu.narrator = levelMenuNarrator(Menu.selected);
      break;
    case 3:
      Menu.selected = CONFIG.LANG === 'en' ? 0 : 1;
      enterMenuScreen('options');
      Menu.narrator = S().menu.nOptions;
      break;
    case 4:
      Menu.selected = 1; // default to No
      enterMenuScreen('quitConfirm');
      Menu.narrator = S().menu.nQuit;
      break;
  }
}

function activateLevelSelection(index) {
  Menu.selected = index;
  if (!isLevelUnlocked(index)) {
    Menu.narrator = S().menu.nLocked;
    AUDIO.play('ui_locked');
    return;
  }
  if (dependsOnPrevious(index + 1)) {
    AUDIO.play('ui_select');
    beginDependencyRedirect(index);
    return;
  }
  AUDIO.play('ui_select');
  startAtLevel(index);
}

function chooseLanguage(lang) {
  const next = lang === 'en' ? 'en' : 'fa';
  AUDIO.play(CONFIG.LANG === next ? 'ui_select' : 'ui_lang');
  setLanguage(next);
  Menu.selected = next === 'en' ? 0 : 1;
  Menu.narrator = S().menu.nLanguage;
}

function activateMenuSelection() {
  switch (Game.mode) {
    case 'menu':
      activateMainSelection(Menu.selected);
      return;
    case 'levels':
      activateLevelSelection(Menu.selected);
      return;
    case 'options':
      if (Menu.selected === 0) chooseLanguage('en');
      else if (Menu.selected === 1) chooseLanguage('fa');
      else if (Menu.selected === 2) {
        AUDIO.play('ui_select');
        toggleSoundSetting();
      } else {
        enterMenuScreen('main');
        Menu.selected = 3;
        Menu.narrator = S().menu.nOptions;
      }
      return;
    case 'quitConfirm':
      if (Menu.selected === 0) {
        AUDIO.play('ui_yes');
        Menu.narrator = S().menu.nYes;
        Menu.screen = 'farewell';
        Game.mode = 'farewell';
      } else {
        AUDIO.play('ui_no');
        enterMenuScreen('main');
        Menu.selected = 4;
        Menu.narrator = S().menu.nNo;
      }
      return;
  }
}

function changeMenuSelection(delta, count) {
  const previous = Menu.selected;
  Menu.selected = (Menu.selected + delta + count) % count;
  if (Menu.selected !== previous) AUDIO.play('ui_move');
  if (Game.mode === 'menu') Menu.narrator = mainItemNarrator(Menu.selected);
  else if (Game.mode === 'levels') Menu.narrator = levelMenuNarrator(Menu.selected);
  else if (Game.mode === 'options')
    Menu.narrator = Menu.selected === 2 ? S().menu.nSound
      : Menu.selected === 3 ? S().menu.nOptions : S().menu.nLanguage;
  else if (Game.mode === 'quitConfirm') Menu.narrator = S().menu.nReally;
}

function handleMenuKeyDown(e) {
  if (Menu.dependencyPendingIndex !== null) return true;
  const code = e.code;
  if (Game.mode === 'farewell') {
    returnToMainMenu();
    return true;
  }
  if (code === 'Escape' || code === 'Backspace') {
    if (Game.mode === 'menu') {
      if (Menu.origin === 'paused') continueFromMenu();
    } else if (Game.mode === 'quitConfirm') {
      enterMenuScreen('main');
      Menu.selected = 4;
      Menu.narrator = S().menu.nNo;
    } else {
      const previousMode = Game.mode;
      enterMenuScreen('main');
      Menu.selected = previousMode === 'levels' ? 2 : 3;
      Menu.narrator = previousMode === 'levels' ? S().menu.nLevels : S().menu.nOptions;
    }
    return true;
  }
  if (code === 'Enter' || code === 'Space') {
    activateMenuSelection();
    return true;
  }

  const up = code === 'ArrowUp' || code === 'KeyW';
  const down = code === 'ArrowDown' || code === 'KeyS';
  const left = code === 'ArrowLeft' || code === 'KeyA';
  const right = code === 'ArrowRight' || code === 'KeyD';

  if (Game.mode === 'menu') {
    if (up) changeMenuSelection(-1, MENU_MAIN_ITEMS.length);
    else if (down) changeMenuSelection(1, MENU_MAIN_ITEMS.length);
    else return false;
    return true;
  }
  if (Game.mode === 'levels') {
    const cols = CONFIG.MENU.levelsCols;
    let next = Menu.selected;
    if (up) next -= cols;
    else if (down) next += cols;
    else if (left) next += CONFIG.LANG === 'fa' ? 1 : -1;
    else if (right) next += CONFIG.LANG === 'fa' ? -1 : 1;
    else return false;
    const previous = Menu.selected;
    Menu.selected = Math.max(0, Math.min(CONFIG.TOTAL_LEVELS - 1, next));
    if (Menu.selected !== previous) AUDIO.play('ui_move');
    Menu.narrator = levelMenuNarrator(Menu.selected);
    return true;
  }
  if (Game.mode === 'options') {
    if (up || down) changeMenuSelection(up ? -1 : 1, 4);
    else if (left || right) {
      if (Menu.selected === 2) {
        AUDIO.play('ui_select');
        toggleSoundSetting();
      } else {
        const previous = Menu.selected;
        Menu.selected = previous === 3 ? (left ? 0 : 1) : (previous === 0 ? 1 : 0);
        if (Menu.selected !== previous) AUDIO.play('ui_move');
        chooseLanguage(Menu.selected === 0 ? 'en' : 'fa');
      }
    } else return false;
    return true;
  }
  if (Game.mode === 'quitConfirm') {
    if (left || right) changeMenuSelection(left ? -1 : 1, 2);
    else if (up || down) changeMenuSelection(up ? -1 : 1, 2);
    else return false;
    return true;
  }
  return false;
}

function pointInRect(p, r) {
  return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}

function canvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * VIEW_W / rect.width,
    y: (e.clientY - rect.top) * VIEW_H / rect.height,
  };
}

function menuHitAt(p) {
  if (Game.mode === 'menu') {
    for (let i = 0; i < MENU_MAIN_ITEMS.length; i++)
      if (pointInRect(p, mainItemRect(i))) return { kind: 'main', index: i };
  } else if (Game.mode === 'levels') {
    for (let i = 0; i < CONFIG.TOTAL_LEVELS; i++)
      if (pointInRect(p, levelCellRect(i))) return { kind: 'level', index: i };
    if (pointInRect(p, backButtonRect(CONFIG.MENU.levelsBackY)))
      return { kind: 'backLevels' };
  } else if (Game.mode === 'options') {
    if (pointInRect(p, optionsLanguageRect('en'))) return { kind: 'language', lang: 'en' };
    if (pointInRect(p, optionsLanguageRect('fa'))) return { kind: 'language', lang: 'fa' };
    if (pointInRect(p, optionsSoundRect())) return { kind: 'sound' };
    if (pointInRect(p, backButtonRect(CONFIG.MENU.optionsBackY)))
      return { kind: 'backOptions' };
  } else if (Game.mode === 'quitConfirm') {
    for (let i = 0; i < 2; i++)
      if (pointInRect(p, quitChoiceRect(i))) return { kind: 'quit', index: i };
  }
  return null;
}

function onCanvasMove(e) {
  if (Game.mode === 'playing' || Game.mode === 'farewell' ||
      Menu.dependencyPendingIndex !== null) return;
  const hit = menuHitAt(canvasPoint(e));
  if (!hit) return;
  if (hit.kind === 'main') {
    if (Menu.selected !== hit.index) AUDIO.play('ui_move');
    Menu.selected = hit.index;
    Menu.narrator = mainItemNarrator(hit.index);
  } else if (hit.kind === 'level') {
    if (Menu.selected !== hit.index) AUDIO.play('ui_move');
    Menu.selected = hit.index;
    Menu.narrator = levelMenuNarrator(hit.index);
  } else if (hit.kind === 'language') {
    const selected = hit.lang === 'en' ? 0 : 1;
    if (Menu.selected !== selected) AUDIO.play('ui_move');
    Menu.selected = selected;
    Menu.narrator = S().menu.nLanguage;
  } else if (hit.kind === 'sound') {
    if (Menu.selected !== 2) AUDIO.play('ui_move');
    Menu.selected = 2;
    Menu.narrator = S().menu.nSound;
  } else if (hit.kind === 'quit') {
    if (Menu.selected !== hit.index) AUDIO.play('ui_move');
    Menu.selected = hit.index;
    Menu.narrator = S().menu.nReally;
  }
}

function onCanvasClick(e) {
  if (Menu.dependencyPendingIndex !== null) return;
  if (Game.mode === 'farewell') {
    returnToMainMenu();
    return;
  }
  if (Game.mode === 'playing' && Game.state === 'end') {
    openMainMenu('end');
    return;
  }
  if (Game.mode === 'playing') return;
  const hit = menuHitAt(canvasPoint(e));
  if (!hit) return;
  if (hit.kind === 'main') activateMainSelection(hit.index);
  else if (hit.kind === 'level') activateLevelSelection(hit.index);
  else if (hit.kind === 'language') chooseLanguage(hit.lang);
  else if (hit.kind === 'sound') {
    Menu.selected = 2;
    AUDIO.play('ui_select');
    toggleSoundSetting();
  }
  else if (hit.kind === 'quit') {
    Menu.selected = hit.index;
    activateMenuSelection();
  } else if (hit.kind === 'backLevels' || hit.kind === 'backOptions') {
    enterMenuScreen('main');
    Menu.selected = hit.kind === 'backLevels' ? 2 : 3;
    Menu.narrator = hit.kind === 'backLevels' ? S().menu.nLevels : S().menu.nOptions;
  }
}

function drawMenuText(text, x, y, font, align, color, alpha, direction) {
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.font = font;
  ctx.direction = direction || CONFIG.UI.direction;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color || CONFIG.MENU.colors.normalText;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawMenuButton(text, rect, selected, active, font) {
  const C = CONFIG.MENU.colors;
  ctx.save();
  roundedRectPath(ctx, rect.x, rect.y, rect.w, rect.h, 12);
  ctx.fillStyle = selected || active ? C.selectedFill : 'rgba(27,29,43,0.82)';
  ctx.fill();
  ctx.lineWidth = selected ? 2 : 1;
  ctx.strokeStyle = selected || active ? C.selectedOutline : 'rgba(207,211,230,0.22)';
  ctx.stroke();
  ctx.restore();
  drawMenuText(text, rect.x + rect.w / 2, rect.y + rect.h * 0.67,
    font || fontStr(activeFonts().menuItem), 'center',
    selected ? C.selectedText : C.normalText);
}

function drawMenuBackdrop() {
  const background = BACKGROUNDS[CONFIG.MENU.bgAct] || BACKGROUNDS[1];
  if (bgAct === CONFIG.MENU.bgAct) drawStaticBG();
  else {
    ctx.save();
    if (background.drawStatic) background.drawStatic(ctx, VIEW_W, VIEW_H);
    ctx.restore();
  }
  if (Game.level && background.drawDynamic)
    background.drawDynamic(ctx, Game, Game.stateTime);
  ctx.save();
  ctx.fillStyle = 'rgba(10,11,16,0.62)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.restore();
  drawSavedDeathTally();
}

function drawSavedDeathTally() {
  const T = CONFIG.MENU.tally;
  const n = Math.min(Math.max(0, Number(save.total) || 0), T.max);
  if (n > 0) {
    ctx.save();
    ctx.strokeStyle = T.color;
    ctx.globalAlpha = T.alpha;
    ctx.lineWidth = T.strokeW;
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const group = Math.floor(i / 5), inner = i % 5;
      const row = Math.floor(group / T.groupsPerRow), col = group % T.groupsPerRow;
      const gx = T.x + col * T.groupGap, gy = T.y + row * T.rowGap;
      ctx.beginPath();
      if (inner < 4) {
        const x = gx + 6 + inner * T.strokeGap;
        ctx.moveTo(x, gy);
        ctx.lineTo(x + (inner % 2 ? 1 : -1), gy + T.strokeLen);
      } else {
        ctx.moveTo(gx + 2, gy + T.strokeLen);
        ctx.lineTo(gx + 32, gy - 3);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  drawMenuText(S().menu.totalDeaths(playerNumber(save.total)),
    T.x + T.w / 2, T.captionY, fontStr(activeFonts().menuSmall), 'center',
    CONFIG.MENU.colors.normalText);
}

function drawMenuNarrator(y) {
  if (!Menu.narrator) return;
  const width = 640, h = 34, x = (VIEW_W - width) / 2;
  ctx.save();
  roundedRectPath(ctx, x, y - h + 3, width, h, 12);
  ctx.fillStyle = 'rgba(20,22,31,0.82)';
  ctx.fill();
  ctx.restore();
  drawMenuText(Menu.narrator, VIEW_W / 2, y - 7,
    fontStr(activeFonts().menuSubtitle), 'center', CONFIG.MENU.colors.normalText);
}

function drawMainMenu() {
  const M = CONFIG.MENU, m = S().menu;
  drawMenuText(m.title, VIEW_W / 2, M.titleY,
    fontStr(activeFonts().menuTitle), 'center', CONFIG.MENU.colors.selectedText);
  const labels = [m.continue, m.start, m.levels, m.options, m.quit];
  for (let i = 0; i < labels.length; i++) {
    const r = mainItemRect(i);
    drawMenuButton(labels[i], r, Menu.selected === i, false);
    if (i === 0) {
      const sub = m.continueSub(playerNumber(save.current), playerNumber(save.total));
      drawMenuText(sub, VIEW_W / 2, r.y + r.h - 6,
        fontStr(activeFonts().menuSmall), 'center', CONFIG.MENU.colors.normalText, 0.9);
    }
  }
  drawMenuNarrator(M.itemStartY - 52);
}

function drawLockIcon(r) {
  ctx.save();
  ctx.strokeStyle = 'rgba(207,211,230,0.55)';
  ctx.fillStyle = 'rgba(207,211,230,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(r.x + r.w - 16, r.y + 15, 5, Math.PI, 0);
  ctx.stroke();
  ctx.fillRect(r.x + r.w - 22, r.y + 15, 12, 10);
  ctx.restore();
}

function drawLevelGrid() {
  const M = CONFIG.MENU, C = M.colors;
  for (let i = 0; i < CONFIG.TOTAL_LEVELS; i++) {
    const r = levelCellRect(i), unlocked = isLevelUnlocked(i);
    const completed = !!save.done[i];
    ctx.save();
    roundedRectPath(ctx, r.x, r.y, r.w, r.h, 10);
    if (unlocked) ctx.fillStyle = Menu.selected === i ? C.selectedCellFill : 'rgba(43,47,69,0.78)';
    else ctx.fillStyle = Menu.selected === i ? C.lockedSelectedFill : C.lockedFill;
    ctx.fill();
    ctx.lineWidth = Menu.selected === i ? 2 : 1;
    ctx.strokeStyle = Menu.selected === i ? C.selectedOutline : 'rgba(207,211,230,0.18)';
    ctx.stroke();
    ctx.restore();

    drawMenuText(playerNumber(i + 1), r.x + r.w / 2, r.y + 43,
      fontStr(activeFonts().menuCell), 'center',
      unlocked ? C.cellText : 'rgba(207,211,230,0.48)');
    if (dependsOnPrevious(i + 1)) {
      ctx.save();
      ctx.globalAlpha = unlocked ? 0.78 : 0.38;
      ctx.fillStyle = C.check;
      for (let dot = 0; dot < 3; dot++) {
        ctx.beginPath(); ctx.arc(r.x + 14 + dot * 7, r.y + 12, 1.8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    if (!unlocked) drawLockIcon(r);
    if (completed) {
      ctx.save();
      ctx.strokeStyle = C.check;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(r.x + 12, r.y + r.h - 18);
      ctx.lineTo(r.x + 19, r.y + r.h - 11);
      ctx.lineTo(r.x + 31, r.y + r.h - 25);
      ctx.stroke();
      ctx.restore();
    }
    const deaths = Number(save.deaths[i]) || 0;
    if (deaths > 0) drawMenuText(playerNumber(deaths), r.x + r.w - 10, r.y + r.h - 8,
      fontStr(activeFonts().menuSmall), 'right', C.death);
  }
}

function drawLevelsScreen() {
  const M = CONFIG.MENU, m = S().menu;
  drawMenuText(m.levels, VIEW_W / 2, M.levelsTitleY,
    fontStr(activeFonts().menuSection), 'center', CONFIG.MENU.colors.selectedText);
  drawMenuNarrator(146);
  drawLevelGrid();
  drawMenuButton(m.back, backButtonRect(M.levelsBackY), false, false,
    fontStr(activeFonts().menuSubtitle));
}

function drawOptionsScreen() {
  const M = CONFIG.MENU, m = S().menu;
  drawMenuText(m.options, VIEW_W / 2, M.optionsHeaderY,
    fontStr(activeFonts().menuSection), 'center', CONFIG.MENU.colors.selectedText);
  drawMenuNarrator(M.optionsStartY - 40);
  drawMenuText(m.language, VIEW_W / 2, M.optionsStartY - 18,
    fontStr(activeFonts().menuSubtitle), 'center', CONFIG.MENU.colors.normalText);
  const en = optionsLanguageRect('en'), fa = optionsLanguageRect('fa');
  drawMenuButton(m.languageEnglish, en, Menu.selected === 0, CONFIG.LANG === 'en',
    fontStr(activeFonts().menuItem));
  drawMenuButton(m.languagePersian, fa, Menu.selected === 1, CONFIG.LANG === 'fa',
    fontStr(activeFonts().menuItem));
  const soundRect = optionsSoundRect();
  drawMenuText(m.sound, VIEW_W / 2, soundRect.y - 8,
    fontStr(activeFonts().menuSubtitle), 'center', CONFIG.MENU.colors.normalText);
  drawMenuButton(save.sound ? m.on : m.off, soundRect, Menu.selected === 2, false,
    fontStr(activeFonts().menuItem));
  drawMenuButton(m.back, backButtonRect(M.optionsBackY), Menu.selected === 3, false,
    fontStr(activeFonts().menuSubtitle));
}

function drawQuitConfirmScreen() {
  const M = CONFIG.MENU, m = S().menu;
  drawMenuText(m.really, VIEW_W / 2, M.quitQuestionY,
    fontStr(activeFonts().menuConfirm), 'center', CONFIG.MENU.colors.selectedText);
  drawMenuNarrator(M.quitQuestionY + 76);
  drawMenuButton(m.yes, quitChoiceRect(0), Menu.selected === 0, false);
  drawMenuButton(m.no, quitChoiceRect(1), Menu.selected === 1, false);
}

function drawFarewellScreen() {
  const m = S().menu;
  const line = m.nFarewell;
  drawMenuNarrator(VIEW_H / 2 - 54);
  drawMenuText(line, VIEW_W / 2, VIEW_H / 2 + 10,
    fontStr(activeFonts().menuConfirm), 'center', CONFIG.MENU.colors.selectedText);
  drawMenuText(m.farewellHint, VIEW_W / 2, CONFIG.MENU.farewellHintY,
    fontStr(activeFonts().menuHint), 'center', CONFIG.MENU.colors.normalText);
}

function renderMenuScreen() {
  drawMenuBackdrop();
  if (Game.mode === 'farewell') {
    drawFarewellScreen();
    return;
  }
  if (Game.mode === 'levels') drawLevelsScreen();
  else if (Game.mode === 'options') drawOptionsScreen();
  else if (Game.mode === 'quitConfirm') drawQuitConfirmScreen();
  else drawMainMenu();
}

canvas.addEventListener('mousemove', onCanvasMove);
canvas.addEventListener('click', onCanvasClick);


// One fixed update (1/60 s).
function update() {
  if (Game.mode !== 'playing') return;
  Game.stateTime++;
  if (Game.flash > 0) Game.flash--;

  // F2 toggles debug mode
  if (Input.debugToggle) {
    Game.debug = !Game.debug;
    if (!Game.debug) bgFakeTally = 0; // debug-only visual reset
  }

  // L toggles the display language only while debug mode is active.
  if (Input.languageToggle && Game.debug)
    setLanguage(CONFIG.LANG === 'fa' ? 'en' : 'fa');

  // K adds 5 fake tally marks to the living wall (debug only, visual only —
  // the real death counters are not touched)
  if (Input.tallyToggle && Game.debug)
    bgFakeTally = Math.min(bgFakeTally + 5, CONFIG.BG.tally.max);

  // debug-only level jumps: N / ']' = next, '[' = previous, 1..9 = jump to room
  if (Game.debug && Game.state === 'playing') {
    if (Input.debugSkip || Input.debugNext) {
      if (Game.levelIndex + 1 < LEVELS.length) debugLoadLevel(Game.levelIndex + 1);
      else enterEndState();
    } else if (Input.debugPrev) {
      if (Game.levelIndex > 0) debugLoadLevel(Game.levelIndex - 1);
    } else if (Input.debugDigit >= 1 && Input.debugDigit <= LEVELS.length) {
      debugLoadLevel(Input.debugDigit - 1);
    }
  }

  // R: restart attempt while playing, restart the whole run on the end screen
  if (Input.restartPressed) {
    if (Game.state === 'playing') restartAttempt(false);
    else if (Game.state === 'end') resetRun();
  }

  switch (Game.state) {
    case 'playing':
      if (Game.freeze > 0) {
        Game.freeze--; // death hitstop; player is already back at spawn
      } else {
        const eff = buildEffectiveInput(Game);
        Game.justJumped = false;
        updatePlayer(eff);
        for (const rule of Game.activeRules) {
          if (rule.onUpdate) rule.onUpdate(Game);
        }
        samplePath();
        recordAttemptFrame(); // Act 3 ghost tape (writes only; physics untouched)
      }
      break;
    case 'complete':
      if (Game.stateTime >= COMPLETE_FRAMES) {
        if (Game.levelIndex + 1 < LEVELS.length) loadLevel(Game.levelIndex + 1);
        else enterEndState(); // only the rooms above exist so far
      }
      break;
    case 'end':
      break;
  }

  updateParticles();

  // one-frame input edges are consumed every update
  Input.jumpPressed = false;
  Input.jumpReleased = false;
  Input.restartPressed = false;
  Input.debugToggle = false;
  Input.debugSkip = false;
  Input.debugDigit = 0;
  Input.debugPrev = false;
  Input.debugNext = false;
  Input.languageToggle = false;
  Input.tallyToggle = false;
}

/* ============================= MAIN LOOP ================================= */
/* Fixed timestep at 60 updates/s: accumulate real elapsed time, run whole
   steps. Rendering happens once per requestAnimationFrame.                 */

let lastTime = performance.now();
let accumulator = 0;

function frame(now) {
  let delta = now - lastTime;
  lastTime = now;
  AUDIO.update(Game, Math.max(0, Math.min(delta, 250)) / 1000);
  if (!document.hidden) updateMenuDependencyWait(now);
  if (document.hidden) {
    accumulator = 0;
    render();
    requestAnimationFrame(frame);
    return;
  }
  if (Game.mode !== 'playing') {
    accumulator = 0; // menus pause the game completely
    render();
    requestAnimationFrame(frame);
    return;
  }
  if (delta > 250) delta = 250; // long frame: don't fast-forward
  // room-time scale: a rule with getTimeScale() (speedByDoorDistance) speeds
  // or slows simulated time; default is exactly 1 (levels 1-11 unchanged).
  // Physics constants per fixed step are the same; rendering stays real-time.
  let ts = 1;
  for (const rule of Game.activeRules) {
    if (rule.getTimeScale) { ts = rule.getTimeScale(Game); break; }
  }
  Game.timeScale = ts; // shown in the debug overlay
  accumulator += delta * ts;

  let steps = 0;
  while (accumulator >= STEP_MS && steps < MAX_STEPS) {
    update();
    accumulator -= STEP_MS;
    steps++;
  }
  if (steps === MAX_STEPS) accumulator = 0; // drop leftover time, stay in sync

  render();
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  clearInputState();
  accumulator = 0;
  lastTime = performance.now(); // hidden time never advances gameplay
});

setLanguage(save.lang);
loadLevel(0);
Game.mode = 'menu';
Menu.screen = 'main';
Menu.origin = 'initial';
Menu.selected = 0;
requestAnimationFrame(frame);
</script>
