// Level numbers are one-based. A pathLava room consumes the previous room's
// winning route, so ordinary level-grid selection must start its prerequisite.
function dependsOnPrevious(n) {
  const index = Math.floor(Number(n)) - 1;
  const def = LEVELS[index];
  return !!(def && Array.isArray(def.rules) && def.rules.includes('pathLava'));
}

function precedingNonDependentIndex(index) {
  let candidate = index - 1;
  while (candidate >= 0 && dependsOnPrevious(candidate + 1)) candidate--;
  return Math.max(0, candidate);
}

// Parses a grid into runtime level data (spawn, door tile, special markers).
function parseLevelGrid(grid) {
  let spawn = null;
  let door = null;
  const buttons = [];    // 'B' tiles
  const buttons2 = [];   // 'b' tiles (second held button; heldGate only)
  const gateTiles = [];  // 'G' tiles
  const sSlots = [];     // 'S' tiles (potential spike slots)
  const mTiles = [];     // 'M' initial positions
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = 0; tx < COLS; tx++) {
      const c = grid[ty][tx];
      if (c === 'P') {
        spawn = {
          x: tx * TILE + (TILE - CONFIG.PLAYER.width) / 2,
          y: (ty + 1) * TILE - CONFIG.PLAYER.height,
        };
      } else if (c === 'D') {
        door = { tx, ty };
      } else if (c === 'B') {
        buttons.push({ tx, ty });
      } else if (c === 'b') {
        buttons2.push({ tx, ty });
      } else if (c === 'G') {
        gateTiles.push({ tx, ty });
      } else if (c === 'S') {
        sSlots.push({ tx, ty });
      } else if (c === 'M') {
        mTiles.push({ tx, ty });
      }
    }
  }
  if (!spawn || !door) console.warn('Level is missing a P or D tile.');
  const spawnTile = spawn
    ? { col: Math.floor(spawn.x / TILE), row: Math.floor(spawn.y / TILE) }
    : null;
  return { spawn, door, spawnTile, buttons, buttons2, gateTiles, sSlots, mTiles };
}

/* ========================== PLAYER / PHYSICS ============================= */

const player = {
  x: 0, y: 0, w: CONFIG.PLAYER.width, h: CONFIG.PLAYER.height,
  vx: 0, vy: 0,
  onGround: false,
  coyote: 0,       // frames of coyote time remaining
  jumpBuffer: 0,   // frames of buffered jump remaining
  facing: 1,
};

let particles = [];  // death-burst squares (and any future effects)

function approach(v, target, amount) {
  return v < target ? Math.min(v + amount, target)
                    : Math.max(v - amount, target);
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function tileChar(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return '#'; // outside = solid
  return Game.level.tiles[ty][tx];
}

function isSolid(tx, ty) {
  const c = tileChar(tx, ty);
  if (c === '#') return true;
  if (c === 'G') return Game.gatesClosed;      // gates are solid while closed
  // 'M' markers in the grid are just spawn points; real positions are dynamic
  return Game.mSolid.has(tx + ',' + ty);
}

// Runs cb(tx, ty) for every tile overlapped by the player's AABB.
function forEachOverlappedTile(cb) {
  const x0 = Math.floor(player.x / TILE);
  const x1 = Math.floor((player.x + player.w - 0.001) / TILE);
  const y0 = Math.floor(player.y / TILE);
  const y1 = Math.floor((player.y + player.h - 0.001) / TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      cb(tx, ty);
}

// Axis-separated AABB collision. Because max speed (12) < tile size (40),
// moving one axis at a time can never tunnel through the tile grid.
function collideX() {
  const p = player;
  const dir = Math.sign(p.vx);
  if (dir === 0) return;
  if (dir > 0) {
    let nx = p.x, hit = false;
    forEachOverlappedTile((tx, ty) => {
      if (isSolid(tx, ty)) { nx = Math.min(nx, tx * TILE - p.w - 0.001); hit = true; }
    });
    if (hit) { p.x = nx; p.vx = 0; }
  } else {
    let nx = p.x, hit = false;
    forEachOverlappedTile((tx, ty) => {
      if (isSolid(tx, ty)) { nx = Math.max(nx, (tx + 1) * TILE + 0.001); hit = true; }
    });
    if (hit) { p.x = nx; p.vx = 0; }
  }
}

function collideY() {
  const p = player;
  const dir = Math.sign(p.vy);
  if (dir === 0) return;
  if (dir > 0) {
    let ny = p.y, hit = false;
    forEachOverlappedTile((tx, ty) => {
      if (isSolid(tx, ty)) { ny = Math.min(ny, ty * TILE - p.h - 0.001); hit = true; }
    });
    // landed = grounded when gravity points down (unchanged); head-bump
    // otherwise (gravityFlip never hits this branch while inverted)
    if (hit) { p.y = ny; p.vy = 0; if (Game.gravityDir > 0) p.onGround = true; }
  } else {
    let ny = p.y, hit = false;
    forEachOverlappedTile((tx, ty) => {
      if (isSolid(tx, ty)) { ny = Math.max(ny, (ty + 1) * TILE + 0.001); hit = true; }
    });
    // "bumped head" with normal gravity (unchanged); with inverted gravity
    // this is actually a landing on the ceiling-side surface (grounded)
    if (hit) { p.y = ny; p.vy = 0; if (Game.gravityDir < 0) p.onGround = true; }
  }
}

function resetPlayerToSpawn() {
  const s = Game.level.spawn;
  player.x = s.x; player.y = s.y;
  player.vx = 0; player.vy = 0;
  player.onGround = false;
  player.coyote = 0; player.jumpBuffer = 0;
  player.facing = 1;
  Game.audioStepTimer = 0;
  Game.audioStepSide = 1;
  // rule-owned global flags always start fresh on level load AND respawn
  Game.gravityDir = 1;
  Game.keysSwapped = false;
  Game.lastMoveDir = null;
}

// death face overlay state (eyes -> small "x" marks for the first frames)
let pDeathFxT = -1, pDeathFxX = 0, pDeathFxY = 0;

function spawnDeathBurst(cx, cy) {
  const V = CONFIG.PLAYER.VISUAL;
  // face overlay (drawn by drawParticles; starts immediately, ~117 ms)
  pDeathFxT = Game.stateTime;
  pDeathFxX = cx; pDeathFxY = cy - 5;
  // the body breaks into 10-14 small rounded squares, scattering and fading
  const n = V.burstMin + Math.floor(Math.random() * (V.burstMax - V.burstMin + 1));
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 4;
    const life = V.burstLifeMin + Math.floor(Math.random() * (V.burstLifeMax - V.burstLifeMin + 1));
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1.5,
      size: 3 + Math.random() * 4,
      life, maxLife: life,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.35,
      color: Math.random() < 0.3 ? COLORS.danger
           : (Math.random() < 0.5 ? V.gradientTop : V.gradientBottom),
    });
  }
}

function updateParticles() {
  for (const q of particles) {
    q.vy += 0.18;
    q.x += q.vx;
    q.y += q.vy;
    q.life--;
  }
  particles = particles.filter(q => q.life > 0);
}

/* ---- path recording -------------------------------------------------------
   Converts a recorded path (points every PATH_SAMPLE_EVERY frames, hitbox
   centers) to a deduplicated list of in-bounds tile cells {col, row}.      */
function pathToTiles(path) {
  const seen = new Set();
  const out = [];
  for (const pt of path) {
    const col = Math.floor(pt.x / TILE);
    const row = Math.floor(pt.y / TILE);
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) continue;
    const key = col + ',' + row;
    if (!seen.has(key)) {
      seen.add(key);
      out.push({ col, row });
    }
  }
  return out;
}

// Persistent routes use compact [column,row] tile pairs, not frame-by-frame
// coordinates. Restoring them at tile centers preserves every gameplay tile
// the original path recorder marked while keeping the save small.
function pathToSavedTiles(path) {
  return pathToTiles(path).map(t => [t.col, t.row]);
}

function savedTilesToPath(pairs) {
  if (!Array.isArray(pairs)) return [];
  return pairs.map(pair => ({
    x: (Number(pair[0]) + 0.5) * TILE,
    y: (Number(pair[1]) + 0.5) * TILE,
  }));
}

function priorPathForLevel(index) {
  if (index <= 0) return [];
  // Debug jumps retain the old stored-route and in-memory fallback behavior.
  for (let i = index - 1; i >= 0; i--) {
    const tiles = save.tiles[i];
    if (Array.isArray(tiles) && tiles.length) return savedTilesToPath(tiles);
  }
  if (Game.levelIndex === index - 1 && Game.run.lastWinPath.length)
    return Game.run.lastWinPath.slice();
  return [];
}

function hasRealSavedPath(index) {
  const tiles = save.tiles && save.tiles[index];
  return Array.isArray(tiles) && tiles.length > 0 &&
    savedTilesToPath(tiles).length > 0;
}

function canContinueDependent(index) {
  return index > 0 && !!save.done[index - 1] && hasRealSavedPath(index - 1);
}

function setSavedCurrent(index) {
  save.current = Math.max(1, Math.min(LEVELS.length, index + 1));
}

function recordSavedDeath(index) {
  save.total = Math.max(0, Math.floor(Number(save.total) || 0)) + 1;
  save.deaths[index] = (Number(save.deaths[index]) || 0) + 1;
  setSavedCurrent(index);
  persistSave();
}

function recordSavedWin(index, path) {
  save.done[index] = 1;
  save.tiles[index] = pathToSavedTiles(path);
  save.highest = Math.max(save.highest, Math.min(CONFIG.TOTAL_LEVELS, index + 2));
  setSavedCurrent(index + 1 < LEVELS.length ? index + 1 : index);
  persistSave();
}

// Records one path sample (hitbox center) every PATH_SAMPLE_EVERY frames.
function samplePath() {
  const run = Game.run;
  run.pathTick++;
  if (run.pathTick % PATH_SAMPLE_EVERY !== 0) return;
  run.currentPath.push({
    x: player.x + player.w / 2,
    y: player.y + player.h / 2,
  });
}

/* --- Act 3 attempt recording ----------------------------------------------
   Every playing frame the player's hitbox CENTER goes into Game.attemptRec
   as flat x,y pairs (plain number array, capped at CONFIG.GHOST.maxFrames —
   pure writes, zero allocations per frame). This is separate from
   run.currentPath / lastWinPath / deathPoints, which stay exactly as-is. */
function recordAttemptFrame() {
  if (Game.attemptFrame >= CONFIG.GHOST.maxFrames) return;
  const i = Game.attemptFrame * 2;
  Game.attemptRec[i] = player.x + player.w / 2;
  Game.attemptRec[i + 1] = player.y + player.h / 2;
  Game.attemptFrame++;
}

/* An attempt ends on death or on manual restart (R): tapes of at least
   minFrames frames move into pastAttempts (newest last, at most 6 kept).
   Attempts ending by WINNING are never stored (onPlayerWin doesn't call this).
   pastAttempts is cleared on level load, never on respawn. */
function endAttemptRecording() {
  if (Game.attemptFrame >= CONFIG.GHOST.minFrames)
    Game.pastAttempts.push(Game.attemptRec.slice(0, Game.attemptFrame * 2));
  while (Game.pastAttempts.length > 6) Game.pastAttempts.shift();
}

/* The input after rules are applied (e.g. mirrorControls). Built fresh each
   playing update from the raw Input, so rules never mutate real key state.
   Jump press/release EDGES are copied through too (inputDelay needs them);
   with no delaying rule they are exactly Input's edges, frame for frame. */
function buildEffectiveInput(game) {
  let eff = {
    left: Input.left, right: Input.right, jumpHeld: Input.jumpHeld,
    jumpPressed: Input.jumpPressed, jumpReleased: Input.jumpReleased,
  };
  for (const rule of game.activeRules) {
    if (rule.modifyInput) eff = rule.modifyInput(eff, game) || eff;
  }
  return eff;
}

function updatePlayer(eff) {
  const p = player;
  const wasGrounded = p.onGround;

  // --- horizontal input: accelerate / friction ---
  const dir = (eff.right ? 1 : 0) - (eff.left ? 1 : 0);
  if (dir !== 0) {
    p.vx += dir * (p.onGround ? PHYS.accelGround : PHYS.accelAir);
    p.vx = Math.max(-PHYS.runSpeed, Math.min(PHYS.runSpeed, p.vx));
    p.facing = dir;
  } else {
    p.vx = approach(p.vx, 0, p.onGround ? PHYS.decelGround : PHYS.decelAir);
  }

  // --- coyote time & jump buffering ---
  if (p.onGround) p.coyote = PHYS.coyoteFrames;
  else if (p.coyote > 0) p.coyote--;

  if (eff.jumpPressed) p.jumpBuffer = PHYS.bufferFrames;
  else if (p.jumpBuffer > 0) p.jumpBuffer--;

  // jump condition is the SAME as always (grounded incl. coyote + buffering);
  // with the gravityFlip rule a jump press instead flips game.gravityDir and
  // tosses the player toward the new "down" at flipImpulse x jump speed
  if (p.jumpBuffer > 0 && p.coyote > 0) {
    if (Game.gravityFlipOn) {
      Game.gravityDir = -Game.gravityDir;
      p.vy = CONFIG.RULES.flipImpulse * -PHYS.jumpVel * Game.gravityDir;
      // a flip is not a jump: Game.justJumped stays false
      AUDIO.play('flip', {
        pan: audioPanForX(p.x + p.w / 2), gravityUp: Game.gravityDir < 0,
      });
    } else {
      p.vy = PHYS.jumpVel * Game.gravityDir;
      Game.justJumped = true; // rules (jumpShift, swapKeysOnJump) listen for this
      AUDIO.play('jump', { pan: audioPanForX(p.x + p.w / 2) });
    }
    p.onGround = false;
    p.coyote = 0;
    p.jumpBuffer = 0;
  }

  // --- variable jump height: early release shortens the jump ---
  // (gravityFlip levels have no variable jump height; "rising" = moving
  //  against the current gravity direction)
  if (eff.jumpReleased && !Game.gravityFlipOn && p.vy * Game.gravityDir < 0)
    p.vy *= PHYS.jumpCut;

  // --- gravity with terminal velocity (terminal FALL speed applies only in
  //     the gravity direction; speeds against gravity are never clamped,
  //     exactly as before — with gravityDir === 1 all of this is identical) ---
  p.vy += PHYS.gravity * Game.gravityDir;
  if (Game.gravityDir > 0) {
    if (p.vy > PHYS.maxFall) p.vy = PHYS.maxFall;
  } else if (p.vy < -PHYS.maxFall) p.vy = -PHYS.maxFall;

  // --- integrate, one axis at a time ---
  p.x += p.vx;
  collideX();
  const impactSpeed = Math.abs(p.vy);
  p.y += p.vy;
  p.onGround = false; // re-detected by collideY if we actually land
  collideY();
  if (!wasGrounded && p.onGround && impactSpeed >= PHYS.maxFall * 0.25) {
    const low = PHYS.maxFall * 0.25;
    const scale = audioClamp((impactSpeed - low) / Math.max(0.001, PHYS.maxFall - low), 0, 1);
    const sourceGain = (0.12 + 0.23 * scale) / 0.35;
    AUDIO.play('land', { gain: sourceGain, pan: audioPanForX(p.x + p.w / 2) });
  }

  // --- hazards (stop checking once we die this frame) ---
  let dead = false;

  // spikes from the ASCII grid (fair, shrunken hitbox)
  forEachOverlappedTile((tx, ty) => {
    if (dead) return;
    const c = tileChar(tx, ty);
    if (c === '^') {
      if (rectsOverlap(p.x, p.y, p.w, p.h,
                       tx * TILE + SPIKE_INSET_X, ty * TILE + SPIKE_INSET_TOP,
                       TILE - SPIKE_INSET_X * 2, TILE - SPIKE_INSET_TOP)) {
        dead = true;
        Game.lastDeathCause = 'spike';
        Game.audioDeathCause = 'spike';
        onPlayerDeath();
      }
    } else if (c === 'v') { // same shrunken hitbox, mirrored top-to-bottom
      if (rectsOverlap(p.x, p.y, p.w, p.h,
                       tx * TILE + SPIKE_INSET_X, ty * TILE,
                       TILE - SPIKE_INSET_X * 2, TILE - SPIKE_INSET_TOP)) {
        dead = true;
        Game.lastDeathCause = 'spike';
        Game.audioDeathCause = 'spike';
        onPlayerDeath();
      }
    }
  });

  // dynamic hazard layer (lava, added spikes, ...), separate from the grid
  if (!dead) {
    forEachOverlappedTile((tx, ty) => {
      if (dead || !Game.hazards.has(tx + ',' + ty)) return;
      dead = true;
      Game.lastDeathCause = 'hazard';
      Game.audioDeathCause = Game.hazards.get(tx + ',' + ty) === 'lava' ? 'lava' : 'spike';
      onPlayerDeath();
    });
  }

  // --- goal: the dynamic door at its CURRENT position ---
  if (!dead) {
    const d = Game.door;
    if (rectsOverlap(p.x, p.y, p.w, p.h, d.x, d.y, d.w, d.h)) onPlayerWin();
  }

  const speed = Math.abs(p.vx);
  if (CONFIG.AUDIO.footsteps && !dead && Game.state === 'playing' && p.onGround &&
      speed > PHYS.runSpeed * 0.2) {
    Game.audioStepTimer += STEP_MS / 1000;
    const ratio = Math.max(0.2, speed / PHYS.runSpeed);
    const cadence = 0.24 / ratio;
    if (Game.audioStepTimer >= cadence) {
      Game.audioStepTimer -= cadence;
      const pan = audioClamp(audioPanForX(p.x + p.w / 2) + Game.audioStepSide * 0.05, -0.4, 0.4);
      AUDIO.play('step', { pan });
      Game.audioStepSide *= -1;
    }
  } else Game.audioStepTimer = 0;
}

/* =============================== RULES =================================== */
/* Registry of gameplay modifiers. A level lists rule ids in its `rules`
   array; every hook is optional:
     onLevelStart(game)      after the level (and all rule state) reset
     onAttemptStart(game)    on level load AND on every respawn/restart
     onRespawn(game)         same timing, after onAttemptStart (Act 3 ghosts)
     onUpdate(game)          each fixed update while playing
     modifyInput(input,game) transforms {left,right,jumpHeld} before physics
     onDraw(ctx,game)        draw world-layer effects (under the player)
     onDeath(game)           after the death point is recorded, before respawn
     onWin(game)             after lastWinPath is saved, before transition
     getTimeScale(game)      room-time multiplier for the main loop (default 1)
   New rule later = one entry here + its id in a level's rules array.
   Per-level rule state lives in game.ruleVars.<ruleId> (reset on load).    */

// Ghost rendering: one reusable pseudo-player object passed to drawPlayer
// (onGround=true keeps the squash/blink timers neutral). No allocations.
const ghostView = { x: 0, y: 0, w: 28, h: 28, vx: 0, vy: 0, onGround: true };

const RULES = {
  /* Your previous winning path turns into lava. */
  pathLava: {
    onLevelStart(game) {
      const path = game.run.lastWinPath;
      if (!path || !path.length) return;
      const door = game.level.door; // the door's INITIAL tile (grid 'D')
      const st = game.level.spawnTile;
      const protectedTiles = new Set([
        door.tx + ',' + door.ty,           // the door itself
        (door.tx - 1) + ',' + door.ty,     // directly in front (approach side)
        door.tx + ',' + (door.ty + 1),     // the tile under the door
      ]);
      for (const t of pathToTiles(path)) {
        if (game.level.tiles[t.row][t.col] !== '.') continue;   // only empty cells
        if (protectedTiles.has(t.col + ',' + t.row)) continue;  // door stays open
        if (Math.max(Math.abs(t.col - st.col), Math.abs(t.row - st.row))
              <= SPAWN_SAFE_RADIUS) continue;                   // spawn stays safe
        game.hazards.set(t.col + ',' + t.row, 'lava');
      }
    },
    onDraw(ctx, game) {
      // pulsing lava: danger color at lower opacity + a brighter top strip
      const t = game.stateTime * 0.08;
      for (const [key, kind] of game.hazards) {
        if (kind !== 'lava') continue;
        const i = key.indexOf(',');
        const tx = +key.slice(0, i), ty = +key.slice(i + 1);
        const pulse = 0.45 + 0.18 * Math.sin(t + tx * 0.9 + ty * 1.7);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = COLORS.danger;
        ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
        ctx.globalAlpha = Math.min(1, pulse + 0.25);
        ctx.fillRect(tx * TILE, ty * TILE, TILE, 5); // hot surface line
      }
      ctx.globalAlpha = 1;
    },
  },

  /* A button opens the gate. Pressed state resets on respawn. */
  buttonGate: {
    onLevelStart(game) {
      game.gatesClosed = true;
      game.ruleVars.buttonGate = { pressed: false };
    },
    onAttemptStart(game) {
      const wasOpen = !game.gatesClosed;
      const wasPressed = game.ruleVars.buttonGate && game.ruleVars.buttonGate.pressed;
      if (wasPressed && game.level.buttons.length) {
        const b = game.level.buttons[0];
        AUDIO.play('button_up', { pan: audioPanForX((b.tx + 0.5) * TILE) });
      }
      game.gatesClosed = true;
      game.ruleVars.buttonGate = { pressed: false };
      if (wasOpen) playGateEdge(game, false);
    },
    onUpdate(game) {
      const v = game.ruleVars.buttonGate;
      if (v.pressed) return;
      for (const b of game.level.buttons) {
        // the button hitbox: drawn rect sits on the floor of its tile
        if (rectsOverlap(player.x, player.y, player.w, player.h,
                         b.tx * TILE + 4, b.ty * TILE + 24, TILE - 8, 16)) {
          v.pressed = true;
          game.gatesClosed = false;
          AUDIO.play('button_down', { pan: audioPanForX((b.tx + 0.5) * TILE) });
          playGateEdge(game, true);
          Narrator.event(game, 'onButton');
          break;
        }
      }
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.buttonGate;
      // buttons: accent rectangle on the floor (sinks when pressed)
      for (const b of game.level.buttons) {
        const x = b.tx * TILE, y = b.ty * TILE;
        ctx.fillStyle = COLORS.accent;
        if (v.pressed) {
          ctx.globalAlpha = 0.8;
          ctx.fillRect(x + 4, y + 32, TILE - 8, 8);
        } else {
          ctx.fillRect(x + 4, y + 24, TILE - 8, 16);
          ctx.fillStyle = COLORS.bg;
          ctx.fillRect(x + 4, y + 24, TILE - 8, 3);
        }
        ctx.globalAlpha = 1;
      }
      // gate tiles: solid while closed, faint outline when open
      for (const g of game.level.gateTiles) {
        const x = g.tx * TILE, y = g.ty * TILE;
        if (game.gatesClosed) {
          ctx.fillStyle = COLORS.text;
          ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = COLORS.wall;
          ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
        } else {
          ctx.globalAlpha = 0.22;
          ctx.strokeStyle = COLORS.text;
          ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
          ctx.globalAlpha = 1;
        }
      }
    },
  },

  /* The door retires toward its target while you hold still. */
  shyDoor: {
    onLevelStart(game) {
      const t = game.level.def.doorTarget;
      game.ruleVars.shyDoor = {
        startX: game.door.x, startY: game.door.y,
        targetX: t.col * TILE, targetY: t.row * TILE,
        progress: 0,
        moving: false,
      };
    },
    onAttemptStart(game) {
      const v = game.ruleVars.shyDoor;
      v.progress = 0;
      v.moving = false;
      game.door.x = v.startX;
      game.door.y = v.startY;
    },
    onUpdate(game) {
      const v = game.ruleVars.shyDoor;
      const holdingStill = player.onGround && !Input.left && !Input.right;
      if (holdingStill && v.progress < 1) {
        v.progress = Math.min(1, v.progress + 1 / 360); // ~6 s full travel
      }
      v.moving = holdingStill && v.progress < 1;
      game.door.x = v.startX + (v.targetX - v.startX) * v.progress;
      game.door.y = v.startY + (v.targetY - v.startY) * v.progress;
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.shyDoor;
      if (!v.moving) return; // only while the door actually creeps (unchanged)
      // arch-shaped pulse around the door's outer frame — same path as the
      // sprite (doorArchPath), stroked just inside the rect bounds. A slow
      // 1-second breathing cycle keeps it gentle: no strobing, no fill/glow.
      const s = Math.sin(game.stateTime * (Math.PI * 2 / 60)); // ~1 pulse/second
      const lw = 4.5 + 1.5 * s;             // ~3..6 px
      ctx.globalAlpha = 0.35 + 0.2 * s;     // ~0.15..0.55
      ctx.strokeStyle = COLORS.door;
      ctx.lineWidth = lw;
      const d = game.door;
      ctx.beginPath();
      doorArchPath(ctx, d.x, d.y, d.w, d.h, lw / 2); // follows the moving door
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1;
    },
  },

  /* Where you die, a spike grows (nearest unused slot, max 4 active). */
  deathSpike: {
    onLevelStart(game) {
      const door = game.level.door, st = game.level.spawnTile;
      game.ruleVars.deathSpike = {
        slots: game.level.sSlots.map(s => ({
          col: s.tx, row: s.ty,
          used: false,
          // runtime guard: slots too close to start/door can never activate
          allowed:
            Math.max(Math.abs(s.tx - st.col), Math.abs(s.ty - st.row)) > DEATH_SPIKE_SAFE &&
            Math.max(Math.abs(s.tx - door.tx), Math.abs(s.ty - door.ty)) > DEATH_SPIKE_SAFE,
        })),
        spikes: [], // FIFO of {key, col, row, born}
      };
    },
    onDeath(game) {
      const v = game.ruleVars.deathSpike;
      const d = game.run.deathPoints[game.run.deathPoints.length - 1];
      // nearest unused, allowed slot to the death point (tile centers)
      let best = null, bestDist = Infinity;
      for (const s of v.slots) {
        if (s.used || !s.allowed) continue;
        const dx = s.col * TILE + 20 - d.x;
        const dy = s.row * TILE + 20 - d.y;
        const dist = dx * dx + dy * dy;
        if (dist < bestDist) { bestDist = dist; best = s; }
      }
      if (!best) return;
      best.used = true;
      // cap: drop the oldest spike when exceeding the cap
      while (v.spikes.length >= DEATH_SPIKE_CAP) {
        const old = v.spikes.shift();
        game.hazards.delete(old.key);
      }
      const key = best.col + ',' + best.row;
      game.hazards.set(key, 'spike');
      v.spikes.push({ key, col: best.col, row: best.row, born: game.stateTime });
      AUDIO.play('spike_pop', { pan: audioPanForX((best.col + 0.5) * TILE) });
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.deathSpike;
      const sp = getSpikeSprite();
      for (const s of v.spikes) {
        const pop = Math.min(1, (game.stateTime - s.born) / 6); // quick pop-in
        const x = s.col * TILE, y = s.row * TILE;
        // same spike look as the static grid; the sprite grows in from the base
        ctx.drawImage(sp, x, y + TILE * (1 - pop), TILE, TILE * pop);
        if (pop >= 1) drawSpikeFx(ctx, s.col, s.row);
      }
    },
  },

  /* Every jump shifts all M stones one tile right (wrapping per lane). */
  jumpShift: {
    onLevelStart(game) {
      game.ruleVars.jumpShift = { pending: [], flashes: new Map() };
    },
    onAttemptStart(game) {
      game.ruleVars.jumpShift.pending = []; // drops delayed moves (stones stay put)
    },
    onUpdate(game) {
      const v = game.ruleVars.jumpShift;
      let moved = false, movedX = player.x + player.w / 2;
      if (game.justJumped) {
        for (const lane of game.level.def.shiftLanes) {
          const cols = [];
          for (const key of game.mSolid) {
            const i = key.indexOf(',');
            const col = +key.slice(0, i), row = +key.slice(i + 1);
            if (row === lane.row && col >= lane.colStart && col <= lane.colEnd) cols.push(col);
          }
          // move rightmost first so a pair never eats its own neighbour
          cols.sort((a, b) => b - a);
          for (const col of cols) {
            const dest = col + 1 > lane.colEnd ? lane.colStart : col + 1;
            const fromKey = col + ',' + lane.row;
            const toKey = dest + ',' + lane.row;
            // blocked = destination still occupied (chains behind a stuck block)
            // or the player is in the way (anti-squash): retry on later frames
            if (game.mSolid.has(toKey) ||
                rectsOverlap(player.x, player.y, player.w, player.h,
                             dest * TILE, lane.row * TILE, TILE, TILE)) {
              v.pending.push({ fromKey, toKey });
              continue;
            }
            game.mSolid.delete(fromKey);
            game.mSolid.add(toKey);
            moved = true; movedX = (dest + 0.5) * TILE;
            v.flashes.set(toKey, 14);
          }
        }
      }
      // retry delayed moves as soon as the destination is free and the player is clear
      for (let i = v.pending.length - 1; i >= 0; i--) {
        const m = v.pending[i];
        const ci = m.toKey.indexOf(',');
        const dCol = +m.toKey.slice(0, ci), dRow = +m.toKey.slice(ci + 1);
        if (game.mSolid.has(m.toKey)) continue; // destination still occupied
        if (rectsOverlap(player.x, player.y, player.w, player.h,
                         dCol * TILE, dRow * TILE, TILE, TILE)) continue;
        game.mSolid.delete(m.fromKey);
        game.mSolid.add(m.toKey);
        moved = true; movedX = (dCol + 0.5) * TILE;
        v.flashes.set(m.toKey, 14);
        v.pending.splice(i, 1);
      }
      if (moved) AUDIO.play('shift', { pan: audioPanForX(movedX) });
      for (const [k, f] of v.flashes) {
        if (f <= 1) v.flashes.delete(k); else v.flashes.set(k, f - 1);
      }
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.jumpShift;
      for (const key of game.mSolid) {
        const i = key.indexOf(',');
        const col = +key.slice(0, i), row = +key.slice(i + 1);
        const x = col * TILE, y = row * TILE;
        const flash = v.flashes.get(key) || 0;
        if (flash > 0) {
          ctx.fillStyle = COLORS.accent;
          ctx.fillRect(x, y, TILE, TILE);
          ctx.globalAlpha = flash / 14;
          ctx.fillRect(x - 2, y - 2, TILE + 4, TILE + 4);
          ctx.globalAlpha = 1;
        } else {
          ctx.fillStyle = COLORS.wall;
          ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = COLORS.accent;
          ctx.fillRect(x, y, TILE, 5);
        }
      }
    },
  },

  /* Left and right are swapped. */
  mirrorControls: {
    modifyInput(input) {
      const l = input.left;
      input.left = input.right;
      input.right = l;
      return input;
    },
  },

  /* Jump press (while grounded, coyote+buffer as usual) flips gravity
     instead of jumping: horizontal control untouched, no jump-cut. The flip
     itself lives in updatePlayer; this rule only owns the state reset.
     R / debug keys are never touched (modifyInput is not implemented). */
  gravityFlip: {
    onLevelStart(game) { game.gravityDir = 1; },
    onAttemptStart(game) { game.gravityDir = 1; },
  },

  /* Every jump START (the same Game.justJumped event jumpShift uses)
     toggles game.keysSwapped. While swapped, left/right are exchanged — a
     direction key that is still held changes meaning in mid-air (intended). */
  swapKeysOnJump: {
    onLevelStart(game) {
      game.keysSwapped = false;
      game.ruleVars.swapKeysOnJump = { t0: -1e9, x: 0, y: 0 }; // FX anchor
    },
    onAttemptStart(game) {
      game.keysSwapped = false;
      game.ruleVars.swapKeysOnJump.t0 = -1e9;
    },
    modifyInput(input, game) {
      if (!game.keysSwapped) return input;
      const l = input.left;
      input.left = input.right;
      input.right = l;
      return input;
    },
    onUpdate(game) {
      if (!game.justJumped) return;
      game.keysSwapped = !game.keysSwapped;
      const v = game.ruleVars.swapKeysOnJump;
      AUDIO.play('swap', { pan: audioPanForX(player.x + player.w / 2) });
      v.t0 = game.stateTime;
      v.x = player.x + player.w / 2; // FX is anchored where the swap happened
      v.y = player.y - 16;           // a little above the head
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.swapKeysOnJump;
      const age = game.stateTime - v.t0;
      const dur = CONFIG.RULES.swapGlyphFrames; // ~400 ms
      if (age < 0 || age >= dur) return;
      // never inside the narrator zone (x 320-960, y 40-140)
      const Z = CONFIG.BG.narratorZone;
      if (v.x > Z.x && v.x < Z.x + Z.w && v.y > Z.y && v.y < Z.y + Z.h) return;
      // two small diagonal arrows crossing in an X, pointing up-left/up-right
      const x = v.x, y = v.y;
      ctx.globalAlpha = 1 - age / dur; // fades out
      ctx.strokeStyle = COLORS.text;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 9, y + 6); ctx.lineTo(x + 9, y - 6);   // rising stroke ->
      ctx.moveTo(x + 9, y - 6); ctx.lineTo(x + 4, y - 6);   // head:  |
      ctx.moveTo(x + 9, y - 6); ctx.lineTo(x + 9, y - 1);   //      \_| shape
      ctx.moveTo(x + 9, y + 6); ctx.lineTo(x - 9, y - 6);   // rising stroke <-
      ctx.moveTo(x - 9, y - 6); ctx.lineTo(x - 4, y - 6);   // head  _|
      ctx.moveTo(x - 9, y - 6); ctx.lineTo(x - 9, y - 1);   //      /
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1;
    },
  },

  /* Gameplay input arrives inputDelayFrames (0.5 s) late — movement keys AND
     jump press/release edges. A FIFO ring holds one snapshot per update;
     until it fills after load/respawn the delayed input is neutral. R and the
     debug keys bypass this entirely (they are not gameplay input). */
  inputDelay: {
    onLevelStart(game) {
      game.ruleVars.inputDelay = { buf: [], lastActive: false };
    },
    onAttemptStart(game) {
      game.ruleVars.inputDelay.buf.length = 0; // fresh 0.5 s of neutral input
      game.ruleVars.inputDelay.lastActive = false;
    },
    modifyInput(input, game) {
      const v = game.ruleVars.inputDelay;
      v.buf.push({
        left: !!input.left, right: !!input.right, jumpHeld: !!input.jumpHeld,
        jumpPressed: !!input.jumpPressed, jumpReleased: !!input.jumpReleased,
      });
      if (v.buf.length <= CONFIG.RULES.inputDelayFrames)
        return { left: false, right: false, jumpHeld: false,
                 jumpPressed: false, jumpReleased: false };
      const delivered = v.buf.shift(); // the input of N updates ago
      const active = !!(delivered.left || delivered.right || delivered.jumpHeld);
      if (delivered.jumpPressed || (active && !v.lastActive))
        AUDIO.play('shift', { pan: audioPanForX(player.x + player.w / 2) });
      v.lastActive = active;
      return delivered;
    },
  },

  /* No walking the same direction twice in a row. A "move" is one continuous
     hold of a horizontal direction; it may start only opposite lastMoveDir.
     A blocked direction is fully ignored (even held) until the opposite move
     happens. Pressing a blocked direction gives a quick horizontal shake. */
  noRepeatDirection: {
    onLevelStart(game) {
      game.lastMoveDir = null;
      game.ruleVars.noRepeatDirection = { cur: 0, prevDir: 0, shakeUntil: -1e9 };
      // cur = dir of the ongoing move (0 = none, moves end on release/reverse)
    },
    onAttemptStart(game) {
      game.lastMoveDir = null;
      const v = game.ruleVars.noRepeatDirection;
      v.cur = 0; v.prevDir = 0; v.shakeUntil = -1e9;
    },
    modifyInput(input, game) {
      const v = game.ruleVars.noRepeatDirection;
      const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      const prev = v.prevDir;
      v.prevDir = dir;
      if (dir === 0) { v.cur = 0; return input; } // release: move ends, ok
      if (v.cur === dir) return input;            // ongoing move continues
      if (dir !== game.lastMoveDir) {             // new move, opposite: start it
        v.cur = dir;
        game.lastMoveDir = dir;
        return input;
      }
      // blocked: ignore horizontally. Shake only on a fresh blocked press.
      if (dir !== prev && v.cur === 0) {
        v.shakeUntil = game.stateTime + 8;        // ~130 ms visual shake
        AUDIO.play('nope', { pan: audioPanForX(player.x + player.w / 2) });
      }
      return { ...input, left: false, right: false };
    },
  },

  /* EASY breather: room time runs slower far from the door, faster near it.
     The multiplier feeds the main-loop accumulator; physics steps and the
     render rate are untouched. Smoothed so it never jumps. */
  speedByDoorDistance: {
    _target(game) {
      const R = CONFIG.RULES;
      const d = Math.hypot(player.x + player.w / 2 - (game.door.x + game.door.w / 2),
                           player.y + player.h / 2 - (game.door.y + game.door.h / 2));
      const t = Math.max(0, Math.min(1, (d - R.timeScaleNear) /
                                        (R.timeScaleFar - R.timeScaleNear)));
      return R.timeScaleMax + (R.timeScaleMin - R.timeScaleMax) * t; // near=fast
    },
    onLevelStart(game) {
      game.ruleVars.speedByDoorDistance = { ts: this._target(game) }; // no jump
    },
    onAttemptStart(game) {
      game.ruleVars.speedByDoorDistance.ts = this._target(game);
    },
    getTimeScale(game) {
      const v = game.ruleVars.speedByDoorDistance;
      v.ts += (this._target(game) - v.ts) * CONFIG.RULES.timeScaleSmooth;
      return v.ts;
    },
  },

  /* ACT 3 core: replays recent stored attempts as translucent echo players.
     level.ghost = { count, delay, lethal, endBehavior, reverse, killable,
                     pressesButtons } — defaults: 1 / 0 / false / 'hold' /
                     false / true / true (killable is reserved, unused so far).
     Ghosts are rebuilt at every attempt start (onRespawn) from the LAST
     `count` tapes of game.pastAttempts (fewer when fewer exist). A ghost is a
     28x28 hitbox centered on the replayed position of attempt frame t, with
     k = t - delay: k<0 inactive; k<=len-1 replays (reverse: rec[len-1-k]);
     past the end: 'hold' keeps the final (reverse: first) position, 'vanish'
     deactivates. Lethal ghosts kill exactly like spikes, but never while
     within spawnImmunityRadius of the level's player start. */
  ghostEcho: {
    onLevelStart(game) {
      game.ruleVars.ghostEcho = { ghosts: [] };
    },
    onRespawn(game) { // level load AND every respawn/R (new tapes included)
      const v = game.ruleVars.ghostEcho;
      const def = game.level.def.ghost || {};
      const count = def.count === undefined ? 1 : def.count;
      const past = game.pastAttempts;
      const n = Math.min(count, past.length);
      v.ghosts.length = 0;
      for (let i = 0; i < n; i++) {
        const rec = past[past.length - n + i]; // window, oldest first
        v.ghosts.push({
          rec, len: rec.length / 2,
          delay: def.delay || 0,
          reverse: !!def.reverse,
          endBehavior: def.endBehavior || 'hold',
          lethal: !!def.lethal,
          killable: def.killable === undefined ? true : def.killable,
          pressesButtons:
            def.pressesButtons === undefined ? true : def.pressesButtons,
          active: false, ended: false, cx: 0, cy: 0,
        });
      }
    },
    onUpdate(game) {
      const v = game.ruleVars.ghostEcho;
      const n = v.ghosts.length;
      if (!n) return;
      const t = game.attemptFrame;
      for (let i = 0; i < n; i++) {
        const g = v.ghosts[i];
        const k = t - g.delay;
        if (k < 0) { g.active = false; continue; }
        let idx;
        if (k > g.len - 1) {
          if (!g.ended) {
            g.ended = true;
            AUDIO.play('ghost_end', { pan: audioPanForX(g.cx) });
          }
          if (g.endBehavior === 'vanish') { g.active = false; continue; }
          idx = g.reverse ? 0 : g.len - 1;          // 'hold'
        } else idx = g.reverse ? g.len - 1 - k : k;
        const wasActive = g.active;
        g.active = true;
        g.cx = g.rec[idx * 2];
        g.cy = g.rec[idx * 2 + 1];
        if (!wasActive) AUDIO.play('ghost_spawn', {
          lethal: g.lethal, pan: audioPanForX(g.cx),
        });
      }
      // lethal overlap: same death handling as spikes, spawn-immunity excepted
      const sx = game.level.spawn.x + player.w / 2;
      const sy = game.level.spawn.y + player.h / 2;
      const r2 = CONFIG.GHOST.spawnImmunityRadius * CONFIG.GHOST.spawnImmunityRadius;
      for (let i = 0; i < n; i++) {
        const g = v.ghosts[i];
        if (!g.lethal || !g.active) continue;
        const dx = g.cx - sx, dy = g.cy - sy;
        if (dx * dx + dy * dy <= r2) continue;         // spawn immunity
        if (rectsOverlap(player.x, player.y, player.w, player.h,
                         g.cx - 14, g.cy - 14, 28, 28)) {
          Game.lastDeathCause = 'ghost';
          Game.audioDeathCause = 'ghost';
          onPlayerDeath();
          break; // respawn rebuilt v.ghosts — stop iterating this frame
        }
      }
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.ghostEcho;
      if (!v.ghosts.length) return;
      const G = CONFIG.GHOST;
      // drawPlayer owns the live player's global squash/blink timers; save and
      // restore them so drawing ghosts never disturbs the player's own look.
      const s0 = pvWasGrounded, s1 = pvLandT, s2 = pvBlinkF, s3 = pvBlinkT;
      for (let i = 0; i < v.ghosts.length; i++) {
        const g = v.ghosts[i];
        if (!g.active) continue;
        ghostView.x = g.cx - 14;
        ghostView.y = g.cy - 14;
        drawPlayer(ctx, ghostView, {
          alpha: G.alpha,
          tintColor: g.lethal ? G.lethalTint : G.helperTint,
          eyesOff: true,
        });
      }
      pvWasGrounded = s0; pvLandT = s1; pvBlinkF = s2; pvBlinkT = s3;
    },
  },

  /* Held buttons: 'B' plus the second kind 'b'. The gate stays open while
     EVERY button is overlapped at the same time — by the player or by an
     active ghost that pressesButtons — and a gate never closes while the
     player's or any ghost's hitbox overlaps one of its tiles (nothing ever
     crushed). State recomputes every update and resets on respawn. Fully
     independent of level 3's latched buttonGate. */
  heldGate: {
    onLevelStart(game) {
      game.gatesClosed = true;
      const total = game.level.buttons.length + game.level.buttons2.length;
      game.ruleVars.heldGate = { pressed: new Array(total).fill(false) };
    },
    onAttemptStart(game) {
      const wasOpen = !game.gatesClosed;
      game.gatesClosed = true;
      const v = game.ruleVars.heldGate;
      for (let i = 0; i < v.pressed.length; i++) v.pressed[i] = false;
      if (wasOpen) playGateEdge(game, false);
    },
    _buttonOver(game, b) {
      // same overlap test as the level-3 button plate
      if (rectsOverlap(player.x, player.y, player.w, player.h,
                       b.tx * TILE + 4, b.ty * TILE + 24, TILE - 8, 16))
        return true;
      const ge = game.ruleVars.ghostEcho;
      if (ge) {
        for (let i = 0; i < ge.ghosts.length; i++) {
          const g = ge.ghosts[i];
          if (!g.active || !g.pressesButtons) continue;
          if (rectsOverlap(g.cx - 14, g.cy - 14, 28, 28,
                           b.tx * TILE + 4, b.ty * TILE + 24, TILE - 8, 16))
            return true;
        }
      }
      const sg = game.ruleVars.scriptedGhost; // level 18: standing guard ghost
      if (sg && sg.alive &&
          rectsOverlap(sg.cx - 14, sg.cy - 14, 28, 28,
                       b.tx * TILE + 4, b.ty * TILE + 24, TILE - 8, 16))
        return true;
      return false;
    },
    _anyoneOnGate(game) {
      const ge = game.ruleVars.ghostEcho;
      const sg = game.ruleVars.scriptedGhost;
      for (const t of game.level.gateTiles) {
        if (rectsOverlap(player.x, player.y, player.w, player.h,
                         t.tx * TILE, t.ty * TILE, TILE, TILE)) return true;
        if (ge) {
          for (const g of ge.ghosts) {
            if (!g.active) continue;
            if (rectsOverlap(g.cx - 14, g.cy - 14, 28, 28,
                             t.tx * TILE, t.ty * TILE, TILE, TILE)) return true;
          }
        }
        if (sg && sg.alive &&
            rectsOverlap(sg.cx - 14, sg.cy - 14, 28, 28,
                         t.tx * TILE, t.ty * TILE, TILE, TILE)) return true;
      }
      return false;
    },
    onUpdate(game) {
      const v = game.ruleVars.heldGate;
      const wasClosed = game.gatesClosed;
      let all = true, i = 0;
      for (const b of game.level.buttons) {
        const p = this._buttonOver(game, b);
        v.pressed[i++] = p;
        all = all && p;
      }
      for (const b of game.level.buttons2) {
        const p = this._buttonOver(game, b);
        v.pressed[i++] = p;
        all = all && p;
      }
      // level.gateMode = 'closedWhilePressed' inverts the gate (level 18):
      // CLOSED while any button is pressed, OPEN while none is.
      if (game.level.def.gateMode === 'closedWhilePressed') {
        let any = false; // no closures in the per-frame path
        for (let k = 0; k < v.pressed.length; k++) any = any || v.pressed[k];
        if (any) {
          if (!game.gatesClosed && !this._anyoneOnGate(game))
            game.gatesClosed = true; // still never close onto anyone
        } else game.gatesClosed = false;
        if (game.gatesClosed !== wasClosed) playGateEdge(game, !game.gatesClosed);
        return;
      }
      if (all) game.gatesClosed = false;
      else if (!game.gatesClosed && !this._anyoneOnGate(game))
        game.gatesClosed = true; // closes only once nobody stands in the tiles
      if (game.gatesClosed !== wasClosed) playGateEdge(game, !game.gatesClosed);
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.heldGate;
      // button plates: accent on the floor; pressed = flattened and brighter
      let i = 0;
      const plates = game.level.buttons.concat(game.level.buttons2);
      for (const b of plates) {
        const x = b.tx * TILE, y = b.ty * TILE;
        const on = v.pressed[i++];
        ctx.fillStyle = COLORS.accent;
        if (on) {
          ctx.fillRect(x + 4, y + 32, TILE - 8, 8);     // sunk flat, full bright
        } else {
          ctx.globalAlpha = 0.8;
          ctx.fillRect(x + 4, y + 24, TILE - 8, 16);
          ctx.globalAlpha = 1;
          ctx.fillStyle = COLORS.bg;
          ctx.fillRect(x + 4, y + 24, TILE - 8, 3);
        }
      }
      // gate tiles: solid while closed, faint outline while open (level-3 look)
      let topY = Infinity, gateX = 0;
      for (const t of game.level.gateTiles) {
        const x = t.tx * TILE, y = t.ty * TILE;
        gateX = x;
        if (y < topY) topY = y;
        if (game.gatesClosed) {
          ctx.fillStyle = COLORS.text;
          ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = COLORS.wall;
          ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
        } else {
          ctx.globalAlpha = 0.22;
          ctx.strokeStyle = COLORS.text;
          ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
          ctx.globalAlpha = 1;
        }
      }
      // indicator lights: one 8px square per button just above the gate's top
      // tile (y = gateTop - 12 = 148 on these rooms — below y 40-140, so
      // outside the narrator zone; the pill never overlaps them)
      if (game.level.gateTiles.length) {
        for (let k = 0; k < plates.length; k++) {
          const lx = gateX + 4 + k * 12, ly = topY - 12;
          if (v.pressed[k]) {
            ctx.fillStyle = COLORS.accent;
            ctx.fillRect(lx, ly, 8, 8);
          } else {
            ctx.strokeStyle = COLORS.accent;
            ctx.strokeRect(lx + 0.5, ly + 0.5, 7, 7);
          }
        }
      }
    },
  },

  /* Spike deaths pave the room (level 17): the cell holding the player's
     hitbox center at death, plus its horizontal NEIGHBORS that are spike
     cells ('^'/'v'), become solid platform cells (dynamic mSolid layer, same
     as gates/movable blocks). Converted spikes vanish from the level copy.
     Never within 3 tiles (Chebyshev) of spawn/door, never walls, at most
     CONFIG.RULES.deathPlatformMax cells per level; they persist across
     respawns and reset only on level load (no onAttemptStart reset here). */
  deathPlatforms: {
    onLevelStart(game) {
      game.ruleVars.deathPlatforms = { cells: [] }; // {col,row,born}
    },
    onDeath(game) {
      if (game.lastDeathCause !== 'spike') return;
      const v = game.ruleVars.deathPlatforms;
      const st = game.level.spawnTile, dr = game.level.door;
      const cx = Math.floor((player.x + player.w / 2) / TILE);
      const cy = Math.floor((player.y + player.h / 2) / TILE);
      let created = 0;
      const tryConvert = (c, r, mustBeSpike) => {
        if (v.cells.length >= CONFIG.RULES.deathPlatformMax) return;
        const ch = game.level.tiles[r][c];
        if (ch === '#' || ch === 'G') return;                 // walls stay
        if (mustBeSpike && ch !== '^' && ch !== 'v') return;  // neighbors: spikes only
        if (Math.max(Math.abs(c - st.col), Math.abs(r - st.row)) <= 3) return;
        if (Math.max(Math.abs(c - dr.tx), Math.abs(r - dr.ty)) <= 3) return;
        const key = c + ',' + r;
        if (game.mSolid.has(key)) return;                     // already converted
        game.mSolid.add(key);
        if (ch === '^' || ch === 'v') { // the spike physically disappears
          const row = game.level.tiles[r];
          game.level.tiles[r] = row.slice(0, c) + '.' + row.slice(c + 1);
          // drop it from the danger-eyes cache too (visual-only list)
          staticDangerTiles = staticDangerTiles.filter(t =>
            !(t.c === c && t.r === r));
        }
        v.cells.push({ col: c, row: r, born: game.stateTime });
        created++;
      };
      tryConvert(cx, cy, false);
      tryConvert(cx - 1, cy, true);
      tryConvert(cx + 1, cy, true);
      if (created) AUDIO.play('platform', { pan: audioPanForX((cx + 0.5) * TILE) });
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.deathPlatforms;
      if (!v.cells.length) return;
      for (const c of v.cells) {
        const x = c.col * TILE, y = c.row * TILE;
        const pop = Math.min(1, (game.stateTime - c.born) / 9); // ~150 ms pop-in
        const h = TILE * pop;
        ctx.fillStyle = COLORS.wall;
        ctx.fillRect(x, y + TILE - h, TILE, h);
        ctx.globalAlpha = 0.45 * pop;
        ctx.fillStyle = COLORS.danger;
        ctx.fillRect(x, y + TILE - h, TILE, 3); // heat stripe on the new step
        ctx.globalAlpha = 1;
      }
    },
  },

  /* A hand-placed, killable ghost guard (level 18): stands at
     def.ghostScript = {col,row} every attempt, presses buttons, not lethal.
     STOMP: dies when overlapping the player while the player moves toward the
     ground (current gravity) AND last frame's feet were above the ghost's top
     edge. No player bounce; side contact does nothing. Kill plays a short
     tint burst and the ghost stays gone until the next respawn. */
  scriptedGhost: {
    onLevelStart(game) {
      game.ruleVars.scriptedGhost =
        { alive: false, cx: 0, cy: 0, prevFeetY: 0, burst: [] };
    },
    onRespawn(game) { // level load AND every respawn: the guard returns
      const sc = game.level.def.ghostScript;
      const v = game.ruleVars.scriptedGhost;
      v.alive = true;
      v.cx = sc.col * TILE + TILE / 2;
      v.cy = (sc.row + 1) * TILE - 14; // feet exactly on the tile row below
      v.prevFeetY = player.y + player.h;
      v.burst.length = 0;
    },
    onUpdate(game) {
      const v = game.ruleVars.scriptedGhost;
      if (v.alive) {
        const falling = player.vy * game.gravityDir > 0.01; // toward the ground
        const above = v.prevFeetY <= v.cy - 14 + 0.5;       // feet above its top
        if (rectsOverlap(player.x, player.y, player.w, player.h,
                         v.cx - 14, v.cy - 14, 28, 28) && falling && above) {
          v.alive = false;
          AUDIO.play('ghost_kill', { pan: audioPanForX(v.cx) });
          v.burst.length = 0;
          for (let i = 0; i < 9; i++) { // 9 small tint squares, ~300 ms
            const a = Math.random() * Math.PI * 2;
            const sp = 1.2 + Math.random() * 2.4;
            v.burst.push({ x: v.cx, y: v.cy, vx: Math.cos(a) * sp,
                           vy: Math.sin(a) * sp - 1.5, t0: game.stateTime });
          }
        }
      }
      v.prevFeetY = player.y + player.h;
    },
    onDraw(ctx, game) {
      const v = game.ruleVars.scriptedGhost;
      if (v.alive) { // same echo rendering as ghostEcho: helper tint, no eyes
        const s0 = pvWasGrounded, s1 = pvLandT, s2 = pvBlinkF, s3 = pvBlinkT;
        ghostView.x = v.cx - 14;
        ghostView.y = v.cy - 14;
        drawPlayer(ctx, ghostView, {
          alpha: CONFIG.GHOST.alpha,
          tintColor: CONFIG.GHOST.helperTint,
          eyesOff: true,
        });
        pvWasGrounded = s0; pvLandT = s1; pvBlinkF = s2; pvBlinkT = s3;
      }
      for (const b of v.burst) { // burst squares, ~18 frames
        const age = game.stateTime - b.t0;
        if (age > 18) continue;
        ctx.globalAlpha = 1 - age / 18;
        ctx.fillStyle = CONFIG.GHOST.helperTint;
        ctx.fillRect(b.x + b.vx * age - 2, b.y + b.vy * age - 2, 4, 4);
        ctx.globalAlpha = 1;
      }
    },
  },
};

/* ============================ BACKGROUNDS ================================ */
/* Each act gets its own BACKGROUNDS entry; future acts add new static looks
   and dynamic effects here. drawStatic renders once into an offscreen canvas
   (only on level load / act change); drawDynamic is drawn every frame behind
   everything and must stay cheap. Missing acts fall back to BACKGROUNDS[1]. */

// offscreen static layer: painted once per level, blitted every frame
const bgCanvas = document.createElement('canvas');
bgCanvas.width = VIEW_W;
bgCanvas.height = VIEW_H;
const bgCtx = bgCanvas.getContext('2d');
let bgAct = null; // act the static layer currently holds

// living-wall state for the dynamic layer (reset on every level load)
let bgFakeTally = 0; // K debug marks — visual only, never touches game state
const bgWall = {
  deathsSeen: 0,   // levelDeaths value last frame (drives pulse + tally growth)
  tallyShown: 0,   // marks shown last frame (marks above this are animating in)
  tallyT0: -1e9,   // stateTime when the tally count last changed
  pulseT0: -1e9,   // stateTime of the last death pulse
};
function resetBGWall() {
  bgFakeTally = 0;
  bgWall.deathsSeen = 0;
  bgWall.tallyShown = 0;
  bgWall.tallyT0 = -1e9;
  bgWall.pulseT0 = -1e9;
}

// renders the static layer for an act (only on level load / act change)
function renderStaticBG(act) {
  bgAct = act;
  const entry = BACKGROUNDS[act] || BACKGROUNDS[1];
  if (entry.drawStatic) entry.drawStatic(bgCtx, VIEW_W, VIEW_H);
}
function drawStaticBG() { ctx.drawImage(bgCanvas, 0, 0); }
function drawDynamicBG() {
  const entry = BACKGROUNDS[bgAct] || BACKGROUNDS[1];
  if (entry.drawDynamic) entry.drawDynamic(ctx, Game, Game.stateTime);
}

// deterministic pseudo-noise seeded by (mark index i, channel k) — scratched
// look without jitter between frames
function bgNoise(i, k) {
  const s = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
  return s - Math.floor(s); // [0,1)
}

// --- shared static painter: blueprint grid + vignette ---
// Colors are parameters so act 2 can re-skin the SAME look; act 1 passes the
// exact original colors, so its output is byte-identical to before.
function paintBGStatic(g, w, h, baseColor, gridColor) {
  g.fillStyle = baseColor;
  g.fillRect(0, 0, w, h);
  // crisp 1px lines: half-pixel offset puts them on pixel centers
  const G = CONFIG.BG.grid, step = TILE, mStep = TILE * G.majorEvery;
  g.lineWidth = 1;
  g.strokeStyle = gridColor;
  g.globalAlpha = G.minorAlpha;
  g.beginPath();
  for (let x = step; x < w; x += step)
    if (x % mStep !== 0) { g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); }
  for (let y = step; y < h; y += step)
    if (y % mStep !== 0) { g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); }
  g.stroke();
  g.globalAlpha = G.majorAlpha;
  g.beginPath();
  for (let x = mStep; x < w; x += mStep) { g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); }
  for (let y = mStep; y < h; y += mStep) { g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); }
  g.stroke();
  g.globalAlpha = 1;
  // very soft vignette: clear center, edges darken by at most 25%
  const V = CONFIG.BG.vignette;
  const outer = Math.hypot(w / 2, h / 2);
  const grad = g.createRadialGradient(w / 2, h / 2, outer * V.innerRatio, w / 2, h / 2, outer);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,' + V.max + ')');
  g.fillStyle = grad;
  g.fillRect(0, 0, w, h);
}

// act 1 static: the original base + grid colors (unchanged look)
function drawBGAct1Static(g, w, h) {
  paintBGStatic(g, w, h, CONFIG.BG.base, CONFIG.BG.grid.color);
}

// act 2 static: same layout, THEMES[2] violet-shifted base + grid tint
function drawBGAct2Static(g, w, h) {
  const T = CONFIG.THEMES[2];
  paintBGStatic(g, w, h, T.bg, T.grid);
}

// act 3 static: same layout, THEMES[3] cool blue base + grid tint
function drawBGAct3Static(g, w, h) {
  const T = CONFIG.THEMES[3];
  paintBGStatic(g, w, h, T.bg, T.grid);
}

// --- act 1: living wall (dynamic) — tally marks, win-path trail, death pulse ---
function drawBGAct1Dynamic(g, game, t) {
  const T = CONFIG.BG.tally, Z = CONFIG.BG.narratorZone;
  const inZone = (x, y) => x >= Z.x && x <= Z.x + Z.w && y >= Z.y && y <= Z.y + Z.h;

  // track deaths: one death pulse per death, tally grows with it
  const real = game.levelDeaths | 0;
  if (real > bgWall.deathsSeen) {
    bgWall.pulseT0 = t;
    bgWall.deathsSeen = real;
  } else if (real < bgWall.deathsSeen) { // safety: level swapped underneath us
    bgWall.deathsSeen = real;
    bgWall.tallyShown = 0;
  }

  // (c) death pulse: the wall brightens slightly once per death, then fades
  const dtp = t - bgWall.pulseT0;
  if (dtp >= 0 && dtp < CONFIG.BG.pulse.frames) {
    g.globalAlpha = CONFIG.BG.pulse.alpha * (1 - dtp / CONFIG.BG.pulse.frames);
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.globalAlpha = 1;
  }

  // (b) faded trail of the last winning path (skipped on pathLava levels,
  //     where lava already shows the path; skipped inside the narrator zone)
  const path = game.run.lastWinPath;
  if (path.length && !game.level.rules.includes('pathLava')) {
    const TR = CONFIG.BG.trail;
    g.strokeStyle = TR.color;
    g.globalAlpha = TR.alpha;
    g.lineWidth = TR.width;
    g.setLineDash(TR.dash);
    g.beginPath();
    let pen = false;
    for (let i = 0; i < path.length; i++) {
      const p = path[i];
      if (inZone(p.x, p.y)) { pen = false; continue; }
      if (!pen) { g.moveTo(p.x, p.y); pen = true; }
      else g.lineTo(p.x, p.y);
    }
    g.stroke();
    g.setLineDash([]);
    g.globalAlpha = 1;
    g.lineWidth = 1;
  }

  // (a) death tally marks: groups of five, hand-scratched, deterministic
  const target = Math.min(bgWall.deathsSeen + bgFakeTally, T.max);
  if (target !== bgWall.tallyShown) {
    bgWall.tallyT0 = t;
    bgWall.tallyShown = Math.max(0, Math.min(target, T.max));
  }
  const n = bgWall.tallyShown;
  if (n > 0) {
    g.strokeStyle = T.color;
    g.globalAlpha = T.alpha;
    g.lineWidth = T.strokeW;
    g.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const grp = Math.floor(i / 5), inner = i % 5;
      const row = Math.floor(grp / T.groupsPerRow), col = grp % T.groupsPerRow;
      const gx = T.x + col * T.groupGap, gy = T.y + row * T.rowGap;
      const dx = (bgNoise(i, 1) - 0.5) * 4, dy = (bgNoise(i, 2) - 0.5) * 4;
      const tilt = (bgNoise(i, 3) - 0.5) * 0.16;
      // newest marks stroke in over ~150ms; older ones are complete
      const frac = (bgWall.tallyT0 > t - T.drawIn && i === n - 1)
        ? Math.max(0.01, (t - bgWall.tallyT0) / T.drawIn)
        : 1;
      g.beginPath();
      if (inner < 4) {
        const sx = gx + 6 + inner * T.strokeGap + dx, sy = gy + dy;
        g.moveTo(sx, sy);
        g.lineTo(sx + tilt * T.strokeLen * frac, sy + T.strokeLen * frac);
      } else { // diagonal slash across the group's four verticals
        const x0 = gx + 2 + dx, y0 = gy + T.strokeLen + dy;
        const x1 = gx + 6 + 3 * T.strokeGap + 4, y1 = gy + dy - 3;
        g.moveTo(x0, y0);
        g.lineTo(x0 + (x1 - x0) * frac, y0 + (y1 - y0) * frac);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
    g.lineWidth = 1;
  }
}

const BACKGROUNDS = {
  1: { drawStatic: drawBGAct1Static, drawDynamic: drawBGAct1Dynamic },
  // act 2 reuses the act 1 look (grid + vignette + living wall), violet-tinted
  2: { drawStatic: drawBGAct2Static, drawDynamic: drawBGAct1Dynamic },
  // act 3 reuses the act 1 look (grid + vignette + living wall), blue-tinted
  3: { drawStatic: drawBGAct3Static, drawDynamic: drawBGAct1Dynamic },
};

/* ============================= RENDERING ================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Scale the canvas with CSS to fit the window, keeping 16:9 (letterboxed).
function fitCanvas() {
  const s = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
  canvas.style.width = Math.floor(VIEW_W * s) + 'px';
  canvas.style.height = Math.floor(VIEW_H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// Active font family and role metrics follow CONFIG.LANG.
function activeFonts() {
  return CONFIG.FONTS[CONFIG.LANG] || CONFIG.FONTS.en;
}

// Builds a canvas font string from an active-language CONFIG.FONTS entry.
function fontStr(f, size) {
  return f.weight + ' ' + (size || f.size) + 'px ' + activeFonts().family;
}

// Central text draw: language direction is the default; debug text may force LTR.
function drawText(str, x, y, font, align, alpha, dir) {
  ctx.globalAlpha = (alpha === undefined ? 1 : alpha);
  ctx.font = font;
  ctx.direction = dir || CONFIG.UI.direction;
  ctx.textAlign = align;
  ctx.fillStyle = COLORS.text;
  ctx.fillText(str, x, y);
  ctx.globalAlpha = 1;
}

function roundedRectPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y,     x + w, y + h, r);
  g.arcTo(x + w, y + h, x,     y + h, r);
  g.arcTo(x,     y + h, x,     y,     r);
  g.arcTo(x,     y,     x + w, y,     r);
  g.closePath();
}

// Shrink-to-fit, then wrap (at most TWO centered lines). Centralized so any
// future long narrator line behaves identically.
function fitNarrator(text) {
  const U = CONFIG.UI.narrator, F = activeFonts().narrator;
  ctx.direction = CONFIG.UI.direction;
  const measure = (s, size) => { ctx.font = fontStr(F, size); return ctx.measureText(s).width; };
  let size = F.size;
  while (size > F.minSize && measure(text, size) > U.maxTextW) size--;
  if (measure(text, size) <= U.maxTextW) return { lines: [text], size };
  // still too wide at the language's minimum size: split at the most width-balanced word boundary
  const words = text.split(' ');
  if (words.length === 1) return { lines: [text], size };
  let best = null;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
    const w = Math.max(measure(a, size), measure(b, size));
    if (!best || w < best.w) best = { w, lines: [a, b] };
  }
  return { lines: best.lines, size };
}

function drawNarrator() {
  const text = Narrator.current;
  if (!text) return;
  const U = CONFIG.UI.narrator;
  const fit = fitNarrator(text);
  const lh = Math.round(fit.size * U.lineHeight);
  const font = fontStr(activeFonts().narrator, fit.size);
  ctx.direction = CONFIG.UI.direction; ctx.font = font;
  const textW = Math.max(...fit.lines.map(l => ctx.measureText(l).width));
  const blockH = fit.lines.length * lh;
  const pillW = Math.min(U.maxPillW, textW + U.padX * 2);
  const pillH = blockH + U.padY * 2;
  const pillX = U.x - pillW / 2, pillY = U.y - blockH / 2 - U.padY;
  // pill backdrop with a very soft shadow
  ctx.save();
  ctx.globalAlpha = U.pillAlpha;
  ctx.fillStyle = U.pillColor;
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 3;
  roundedRectPath(ctx, pillX, pillY, pillW, pillH, U.pillRadius);
  ctx.fill();
  ctx.restore();
  fit.lines.forEach((line, i) => {
    const baseY = U.y - blockH / 2 + lh * i + lh * 0.7; // blocks centered at U.y
    drawText(line, U.x, baseY, font, 'center');
  });
}

function drawRoom() {
  const tiles = Game.level.tiles;
  ctx.fillStyle = COLORS.wall;
  for (let ty = 0; ty < ROWS; ty++)
    for (let tx = 0; tx < COLS; tx++)
      if (tiles[ty][tx] === '#')
        ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
}

// The spike's flat "steel blade with hot tip" look is painted ONCE into a
// tiny sprite and blitted with drawImage everywhere. Only the rare gentle
// glint is drawn live. Geometry is identical to the original triangles.
let spikeSprite = null;
function getSpikeSprite() {
  if (spikeSprite) return spikeSprite;
  const S = CONFIG.SPIKE;
  const c = document.createElement('canvas');
  c.width = TILE; c.height = TILE;
  const g = c.getContext('2d');
  // two teeth per tile, identical geometry as always: tips y+10, base y+40
  for (const base of [0, 20]) {
    const apex = base + 10, tipY = 10;
    // hot tip: sub-triangle of the same tooth (same apex, same slopes)
    const yTipBase = tipY + (TILE - tipY) * S.tipRatio; // steel/hot split line
    const xl = apex + (base - apex) * S.tipRatio;       // left slope point at split
    const xr = apex + (base + 20 - apex) * S.tipRatio;  // right slope point
    // steel body, split flat into light left / dark right halves
    g.fillStyle = S.steelLight;
    g.beginPath();
    g.moveTo(base, TILE); g.lineTo(apex, tipY); g.lineTo(apex, TILE); g.closePath();
    g.fill();
    g.fillStyle = S.steelDark;
    g.beginPath();
    g.moveTo(apex, tipY); g.lineTo(base + 20, TILE); g.lineTo(apex, TILE); g.closePath();
    g.fill();
    // hot tip halves
    g.fillStyle = S.hotLight;
    g.beginPath();
    g.moveTo(apex, tipY); g.lineTo(xl, yTipBase); g.lineTo(apex, yTipBase); g.closePath();
    g.fill();
    g.fillStyle = S.hotDark;
    g.beginPath();
    g.moveTo(apex, tipY); g.lineTo(apex, yTipBase); g.lineTo(xr, yTipBase); g.closePath();
    g.fill();
  }
  spikeSprite = c;
  return c;
}

// ceiling variant of the SAME sprite, rendered once by flipping vertically
// ('v' tiles: teeth hang down from the top of their tile)
let spikeSpriteV = null;
function getSpikeSpriteV() {
  if (spikeSpriteV) return spikeSpriteV;
  const c = document.createElement('canvas');
  c.width = TILE; c.height = TILE;
  const g = c.getContext('2d');
  g.translate(0, TILE);
  g.scale(1, -1);
  g.drawImage(getSpikeSprite(), 0, 0);
  spikeSpriteV = c;
  return c;
}

// the ONLY live per-spike effect: a rare gentle glint (~300 ms fade, each
// tile on its own deterministic 4-8 s cycle, so spikes never sync up).
// down=true mirrors it for 'v' ceiling spikes (drifts down the edge instead).
function drawSpikeFx(g, tx, ty, down) {
  const S = CONFIG.SPIKE;
  if (!S.glint) return;
  const t = Game.stateTime;
  const x = tx * TILE, y = ty * TILE;
  const h = bgNoise(tx * 3 + ty * 11, 8);
  const cycle = Math.round(S.glintMin + h * (S.glintMax - S.glintMin));
  const local = (t + Math.floor(h * cycle)) % cycle;
  if (local < S.glintFrames) {
    const k = local / S.glintFrames;            // 0..1
    const px = x + 2 + 8 * k;
    const py = down ? y + 6 + 20 * k            // ceiling clone: drift down
                    : y + TILE - 6 - 20 * k;    // up the edge (unchanged)
    g.globalAlpha = Math.sin(Math.PI * k) * S.glintAlpha;
    g.strokeStyle = S.glintColor;
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(px - 2, down ? py - 4 : py + 4);
    g.lineTo(px + 2, down ? py + 4 : py - 4);
    g.stroke();
    g.globalAlpha = 1;
    g.lineWidth = 1;
  }
}

function drawSpikes() {
  const tiles = Game.level.tiles;
  const sp = getSpikeSprite();
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = 0; tx < COLS; tx++) {
      const ch = tiles[ty][tx];
      if (ch === '^') {
        ctx.drawImage(sp, tx * TILE, ty * TILE);
        drawSpikeFx(ctx, tx, ty);
      } else if (ch === 'v') { // ceiling spike: identical sprite, flipped once
        ctx.drawImage(getSpikeSpriteV(), tx * TILE, ty * TILE);
        drawSpikeFx(ctx, tx, ty, true);
      }
    }
  }
}

/* ---- exit door: static "portal" arch --------------------------------------
   Painted once per door size into an offscreen sprite, then blitted at the
   CURRENT game.door position every frame. Only paint — game.door (the win
   hitbox) is never read or changed by any of this.                          */

// ONE shared arch outline for the door sprite AND its moving pulse, so both
// shapes always match. Draws an arch inside the rectangle (x, y, w, h): flat
// bottom at y+h, straight sides, semicircle cap of the largest fitting
// radius. `inset` (px per side) narrows the arch without changing its shape.
function doorArchPath(g, x, y, w, h, inset) {
  const ix = inset || 0;
  const bx = x + ix, bw = Math.max(2, w - 2 * ix);
  const r = Math.min(bw / 2, h);          // cap radius (largest that fits)
  const shoulderY = y + h - r;            // side-to-cap junction line
  const capR = Math.min(bw / 2, h - r);   // fits above the shoulder line
  g.moveTo(bx, y + h);
  g.lineTo(bx, shoulderY);
  if (capR > 0.5) g.arc(bx + bw / 2, shoulderY, capR, Math.PI, 0, false);
  g.lineTo(bx + bw, y + h);
  g.closePath();
}

const doorSprites = new Map(); // one cached sprite per door size 'w x h'
function getDoorSprite(w, h) {
  const key = w + 'x' + h;
  const spr = doorSprites.get(key);
  if (spr) return spr;
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(w));
  c.height = Math.max(2, Math.ceil(h));
  const g = c.getContext('2d');
  const D = CONFIG.DOOR;
  const ix1 = Math.max(D.inset1 * w, D.minInset);   // opening inset, each side
  const ix2 = ix1 + D.inset2 * w;                    // depth inset, each side
  g.fillStyle = D.frame;
  g.beginPath(); doorArchPath(g, 0, 0, w, h, 0); g.fill();
  g.fillStyle = D.opening;
  g.beginPath(); doorArchPath(g, 0, 0, w, h, ix1); g.fill();
  g.fillStyle = D.depth;
  g.beginPath(); doorArchPath(g, 0, 0, w, h, ix2); g.fill();
  doorSprites.set(key, c);
  return c;
}

function drawDoor() {
  const d = Game.door;
  ctx.drawImage(getDoorSprite(d.w, d.h), d.x, d.y);
}

/* The ONLY place the player's look is defined. Replace this one function when
   the character art changes — physics (28x28 hitbox) stays untouched.
   ALL drawing stays inside the 28x28 footprint; the body is feet-anchored.
   opts (reserved for later steps; in-game today only the win animation uses
   scale/offset): { alpha, tintColor, eyesOff, flipY, scale, offsetX, offsetY } */

let pvBlinkT = 180;         // frames until next blink
let pvBlinkF = 0;           // frames left in current blink
let pvLandT = 0;            // landing-squash frames left
let pvWasGrounded = false;

// etc: '^' tiles of the current level, cached on load (danger-eyes check)
let staticDangerTiles = [];

function playerNearDanger(p) {
  const R = CONFIG.PLAYER.VISUAL.dangerRange; // tiles (Chebyshev)
  const cpx = Math.floor((p.x + p.w / 2) / TILE);
  const cpy = Math.floor((p.y + p.h / 2) / TILE);
  for (let i = 0; i < staticDangerTiles.length; i++) {
    const d = staticDangerTiles[i];
    if (Math.abs(d.c - cpx) <= R && Math.abs(d.r - cpy) <= R) return true;
  }
  for (const key of Game.hazards.keys()) { // lava (level 2) + added spikes (level 5)
    const ci = key.indexOf(',');
    if (Math.abs(+key.slice(0, ci) - cpx) <= R &&
        Math.abs(+key.slice(ci + 1) - cpy) <= R) return true;
  }
  return false;
}

function drawPlayer(g, p, opts) {
  opts = opts || {};
  const V = CONFIG.PLAYER.VISUAL;

  // ---- per-frame visual timers (the game's single live player) ----
  const landedNow = p.onGround && !pvWasGrounded;
  pvWasGrounded = p.onGround;
  if (landedNow) pvLandT = V.squashFrames;
  else if (pvLandT > 0 && p.onGround) pvLandT--;
  else if (!p.onGround) pvLandT = 0;
  if (pvBlinkF > 0) pvBlinkF--;
  else if (--pvBlinkT <= 0) {
    pvBlinkF = V.blinkLen;
    pvBlinkT = V.blinkMin + Math.round(Math.random() * (V.blinkMax - V.blinkMin));
  }

  // ---- squash & stretch (feet anchored, never beyond the 28x28 box) ----
  const W = p.w - 2 * V.inset, H = p.h - 2 * V.inset; // 26x26 base inside the box
  const fxScale = (opts.scale === undefined) ? 1 : opts.scale;   // win anim: shrink into the door
  const ox = Math.round(opts.offsetX || 0), oy = Math.round(opts.offsetY || 0);
  let sy = 1;
  if (pvLandT > 0) {
    const k = pvLandT / V.squashFrames;
    sy = 1 - (1 - V.squashY) * k;                    // squash, recovering over ~100ms
  } else if (!p.onGround) {
    if (p.vy < -6) sy = 1 + V.stretchUpMax * Math.min(1, -p.vy / 13);
    else if (p.vy > 5) sy = 1 + V.stretchFallMax * Math.min(1, p.vy / 11);
  }
  const sx = Math.min(1 + (1 - sy) * 0.6, p.w / W);  // slight counter-scaling, capped
  const dw = Math.max(1, Math.round(W * sx * fxScale));
  const dh = Math.max(1, H * sy * fxScale);          // <= 28 normally (scale const waived <1)
  const bx = Math.round(p.x) + ox + Math.floor((p.w - dw) / 2);
  const by = Math.round(p.y) + oy + p.h - dh;        // feet stay on the hitbox floor

  g.save();
  if (opts.alpha !== undefined) g.globalAlpha = opts.alpha;
  const flipY = (yy, hh) => (opts.flipY ? 2 * (Math.round(p.y) + oy + p.h / 2) - yy - hh : yy); // ceiling-anchored when flipped

  // ---- body: rounded rect, subtle vertical shading, thin top highlight ----
  const bodyTop = flipY(by, dh); // === by when not flipped (identical path)
  g.beginPath();
  roundedRectPath(g, bx, bodyTop, dw, dh, CONFIG.PLAYER.cornerRadius);
  if (opts.tintColor) {
    g.fillStyle = opts.tintColor;
  } else {
    const grad = g.createLinearGradient(bx, bodyTop, bx, bodyTop + dh);
    grad.addColorStop(0, V.gradientTop);
    grad.addColorStop(1, V.gradientBottom);
    g.fillStyle = grad;
  }
  g.fill();
  if (!opts.tintColor) { // thin light line along the top edge
    g.strokeStyle = V.topHighlight;
    g.lineWidth = 1;
    g.beginPath();
    const hy = flipY(by + 0.5, 1);
    g.moveTo(bx + CONFIG.PLAYER.cornerRadius, hy);
    g.lineTo(bx + dw - CONFIG.PLAYER.cornerRadius, hy);
    g.stroke();
  }

  // ---- eyes (skipped for ghosts via opts.eyesOff) ----
  if (!opts.eyesOff) {
    const big = playerNearDanger(p) ? V.eyeBigFactor : 1;
    const ew = V.eyeW * big;
    const eh = (pvBlinkF > 0 ? V.eyeH * 0.25 : V.eyeH * big); // lids drop vertically
    // gaze follows actual velocity; at rest, glance slightly toward the door
    let look = 0;
    if (Math.abs(p.vx) > 0.3) look = Math.sign(p.vx);
    else look = Math.sign(Game.door.x + Game.door.w / 2 - (p.x + p.w / 2)) * 0.6;
    if (opts.flipY) look = -look;
    const ex = bx + dw / 2, ey = flipY(by + V.eyeY, eh);
    g.fillStyle = V.eyeColor;
    for (const sgn of [-1, 1]) {
      const cxx = ex + sgn * V.eyeGap / 2 + look * 1.2;
      roundedRectPath(g, cxx - ew / 2, ey, ew, Math.max(eh, 0.8), 1.2);
      g.fill();
      if (pvBlinkF === 0) { // tiny white glint inside each eye
        g.fillStyle = V.eyeGlint;
        g.fillRect(cxx - ew / 2 + look * 1.2 * 0.3, ey + 0.8, 1, 1);
        g.fillStyle = V.eyeColor;
      }
    }
  }
  g.restore();
}

function drawParticles() {
  // death pieces: small rounded squares that scatter, spin, shrink and fade
  for (const q of particles) {
    const f = Math.max(0, q.life / q.maxLife);
    const s = q.size * (0.4 + 0.6 * f);
    ctx.globalAlpha = f;
    ctx.fillStyle = q.color;
    ctx.save();
    ctx.translate(q.x, q.y);
    ctx.rotate(q.rot + q.spin * (q.maxLife - q.life));
    roundedRectPath(ctx, -s / 2, -s / 2, s, s, Math.min(2.5, s / 3));
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // dead-face overlay: eyes become "x" marks for the first ~117 ms
  if (pDeathFxT >= 0) {
    const age = Game.stateTime - pDeathFxT;
    const dur = CONFIG.PLAYER.VISUAL.xEyeFrames;
    if (age <= dur) {
      const s = 2.4 + age * 0.12, drift = age * 0.5;
      ctx.globalAlpha = 1 - age / (dur + 1);
      ctx.strokeStyle = CONFIG.PLAYER.VISUAL.eyeColor;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (const ox of [-4.5, 4.5]) {
        ctx.beginPath();
        ctx.moveTo(pDeathFxX + ox - s, pDeathFxY - s - drift);
        ctx.lineTo(pDeathFxX + ox + s, pDeathFxY + s - drift);
        ctx.moveTo(pDeathFxX + ox + s, pDeathFxY - s - drift);
        ctx.lineTo(pDeathFxX + ox - s, pDeathFxY + s - drift);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1;
    } else pDeathFxT = -1;
  }
}

/* ---- debug view (F2) ---- */

function drawPathLine(path, color, alpha) {
  if (!path || path.length < 2) return;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
}

function drawDebug() {
  // paths
  drawPathLine(Game.run.lastWinPath, COLORS.door, 0.6);    // green: last win
  drawPathLine(Game.run.currentPath, COLORS.player, 0.45); // white: current

  // potential spike slots as faint outlines
  ctx.globalAlpha = 0.28;
  ctx.strokeStyle = COLORS.text;
  for (const s of Game.level.sSlots) {
    ctx.strokeRect(s.tx * TILE + 2.5, s.ty * TILE + 2.5, TILE - 5, TILE - 5);
  }
  ctx.globalAlpha = 1;

  // death points for this level as small x marks
  ctx.strokeStyle = COLORS.danger;
  ctx.lineWidth = 2;
  for (const d of Game.run.deathPoints) {
    if (d.level !== Game.levelIndex) continue;
    ctx.beginPath();
    ctx.moveTo(d.x - 5, d.y - 5); ctx.lineTo(d.x + 5, d.y + 5);
    ctx.moveTo(d.x + 5, d.y - 5); ctx.lineTo(d.x - 5, d.y + 5);
    ctx.stroke();
  }
  ctx.lineWidth = 1;

  drawText(S().debug.progress(Game.mode, save.highest, save.current, save.total),
           CONFIG.UI.debugInfo.x, CONFIG.UI.debugInfo.yProgress,
           fontStr(activeFonts().debug), 'left', 0.8, 'ltr');

  // STEP 5B: deathPlatform count + scripted-ghost state + gate mode
  const dpDbg = Game.ruleVars.deathPlatforms;
  const sgDbg = Game.ruleVars.scriptedGhost;
  drawText(S().debug.act3State(
             dpDbg ? dpDbg.cells.length : 0,
             sgDbg ? (sgDbg.alive ? S().debug.ghostAlive
                                  : S().debug.ghostKilled)
                   : S().debug.fieldNone,
             Game.level.def.gateMode || S().debug.gateModeNormal),
           CONFIG.UI.debugInfo.x, CONFIG.UI.debugInfo.yAct3,
           fontStr(activeFonts().debug), 'left', 0.8, 'ltr');

  // Act 3: attempt recording + ghost diagnostics
  const geDbg = Game.ruleVars.ghostEcho;
  const lensDbg = Game.pastAttempts.map(a => a.length / 2).join(','); // debug-only
  let ghostDbg = S().debug.ghostsNone;
  if (geDbg && geDbg.ghosts.length) {
    const parts = [];
    for (let i = 0; i < geDbg.ghosts.length; i++) {
      const g = geDbg.ghosts[i];
      parts.push(S().debug.ghostEntry(i, g.active,
        Math.round(g.cx), Math.round(g.cy)));
    }
    ghostDbg = parts.join(' | ');
  }
  drawText(S().debug.ghostState(Game.attemptFrame,
             Game.pastAttempts.length, lensDbg, ghostDbg),
           CONFIG.UI.debugInfo.x, CONFIG.UI.debugInfo.yGhost,
           fontStr(activeFonts().debug), 'left', 0.8, 'ltr');

  // corner info: live rule state + active rules + deaths
  drawText(S().debug.ruleState(Game.gravityDir, Game.keysSwapped,
           Game.lastMoveDir, Game.timeScale, Game.inputDelayOn),
           CONFIG.UI.debugInfo.x, CONFIG.UI.debugInfo.yState,
           fontStr(activeFonts().debug), 'left', 0.8, 'ltr');
  const ids = Game.level.rules.slice();
  drawText(S().debug.rules(ids), CONFIG.UI.debugInfo.x, CONFIG.UI.debugInfo.yRules,
           fontStr(activeFonts().debug), 'left', 0.8, 'ltr');
  drawText(S().debug.deaths(Game.deaths), CONFIG.UI.debugInfo.x, CONFIG.UI.debugInfo.yDeaths,
           fontStr(activeFonts().debug), 'left', 0.8, 'ltr');
  const audio = AUDIO.debugInfo();
  const audioLine = 'audio: ' + audio.state + ' voices: ' + audio.voices + '/' + CONFIG.AUDIO.maxVoices +
    ' mute: ' + (audio.muted ? 'on' : 'off') + ' muffled: ' + (audio.muffled ? 'on' : 'off') +
    ' act: ' + audio.act + ' root: ' + audio.root + 'Hz fifth: ' + audio.fifth +
    'Hz detune: ' + audio.detune.toFixed(1) +
    'c audition: ' + (Game.audioLastAudition || '-');
  drawText(audioLine, CONFIG.UI.debugInfo.x, 716,
           fontStr(activeFonts().debug), 'left', 0.8, 'ltr');
}

/* ---- HUD & overlays ---- */

function drawHUD() {
  const ui = CONFIG.UI;
  const mirrored = CONFIG.LANG === 'fa' && ui.mirrorHudInRtl;
  const roomX = mirrored ? ui.hudDeaths.x : ui.hudRoom.x;
  const roomAlign = mirrored ? 'right' : 'left';
  const deathsX = mirrored ? ui.hudRoom.x : ui.hudDeaths.x;
  const deathsAlign = mirrored ? 'left' : 'right';
